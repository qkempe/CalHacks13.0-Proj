<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Function Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fffdf7; --ink:#1f2a44; --grid:#cfe3f7; --axis:#5b6b8c; --trace:#7c3aed; --answer:#16a34a; --cursor:#f97316;
    --sky1:#dff3ff; --sky2:#fff4d6; --card:#ffffff; --shadow:#1f2a4422;
    --red:#ff6b6b; --yellow:#ffc93c; --green:#3ccf7a; --blue:#4d96ff; --purple:#9b5de5;
  }
  body.contrast {
    --bg:#000; --ink:#fff; --grid:#333; --axis:#ccc; --trace:#ffd400; --answer:#00e5ff; --cursor:#ff4fd8;
    --sky1:#000; --sky2:#000; --card:#111; --shadow:#0000;
    --red:#ff4fd8; --yellow:#ffd400; --green:#00e5ff; --blue:#ffd400; --purple:#ff4fd8;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:"Nunito", system-ui, sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 10% 15%, #ffffff99 0 60px, transparent 61px),
      radial-gradient(circle at 88% 10%, #ffffff99 0 80px, transparent 81px),
      linear-gradient(180deg, var(--sky1), var(--sky2));
    background-attachment:fixed;
  }
  main { max-width:860px; margin:0 auto; padding:0 16px 32px; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:860px; margin:0 auto; padding:16px; }
  .brand { font-family:"Fredoka", sans-serif; font-weight:700; font-size:1.8rem; letter-spacing:.5px; }
  .brand span:nth-child(1){color:var(--red)} .brand span:nth-child(2){color:var(--blue)}
  #dots { display:flex; gap:8px; }
  #dots i { width:16px; height:16px; border-radius:50%; background:var(--card); border:3px solid var(--ink); opacity:.35; }
  #dots i.done { background:var(--green); opacity:1; }
  #dots i.now { background:var(--yellow); opacity:1; transform:scale(1.25); }

  .eq-card {
    display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
    background:var(--card); border:4px solid var(--ink); border-radius:24px; padding:12px 20px;
    box-shadow:0 6px 0 var(--ink);
  }
  .eq-label { font-family:"Fredoka", sans-serif; font-size:1.2rem; background:var(--yellow); color:#1f2a44; padding:4px 14px; border-radius:999px; }
  #eq { font-family:"Fredoka", sans-serif; font-size:2.4rem; font-weight:700; color:var(--purple); }

  .actions { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin:18px 0; }
  button {
    font-family:"Fredoka", sans-serif; font-size:1.3rem; font-weight:600; padding:12px 26px;
    border-radius:18px; border:4px solid var(--ink); color:#1f2a44; cursor:pointer;
    box-shadow:0 5px 0 var(--ink); transition:transform .08s, box-shadow .08s;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 7px 0 var(--ink); }
  button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #clear { background:var(--yellow); } #check { background:var(--green); } #next { background:var(--blue); color:#fff; }
  body.contrast button { color:#000; }

  #stage {
    position:relative; width:100%; aspect-ratio:4/3; margin:0 auto; overflow:hidden;
    border:5px solid var(--ink); border-radius:28px; background:var(--bg); box-shadow:0 8px 0 var(--ink);
  }
  #cam, #board { position:absolute; inset:0; width:100%; height:100%; }
  #cam { transform:scaleX(-1); opacity:.18; object-fit:cover; }

  /* Zoom controls float in the bottom-right corner of the graph */
  .zoom {
    position:absolute; right:12px; bottom:12px; z-index:2; display:flex; align-items:center; gap:6px;
    background:var(--card); border:3px solid var(--ink); border-radius:999px; padding:4px 6px;
  }
  .zoom button { width:44px; height:44px; padding:0; font-size:1.5rem; border-radius:50%; border-width:3px;
    background:var(--card); color:var(--ink); box-shadow:0 3px 0 var(--ink); }
  .zoom button:disabled { opacity:.3; cursor:default; transform:none; }
  #zoomLabel { font-family:"Fredoka", sans-serif; font-weight:600; min-width:4.2em; text-align:center; }
  #result .breakdown { display:block; font-size:.95rem; font-weight:600; opacity:.75; margin-top:4px; }

  /* Hand pointer: follows your index finger anywhere on the page */
  #handPointer {
    position:fixed; left:0; top:0; z-index:1000; width:38px; height:38px; margin:-19px 0 0 -19px;
    border:5px solid var(--cursor); border-radius:50%; pointer-events:none; display:none;
    background:#ffffff66; font-size:1.2rem; line-height:28px; text-align:center;
  }
  #handPointer.pinch { background:var(--cursor); }
  .hand-hover { outline:5px solid var(--cursor); outline-offset:3px; }
  #toast {
    position:fixed; left:50%; top:20px; transform:translateX(-50%); z-index:1001; display:none;
    font-family:"Fredoka", sans-serif; font-size:1.4rem; font-weight:600; padding:10px 22px;
    background:var(--card); color:var(--ink); border:4px solid var(--ink); border-radius:999px; box-shadow:0 5px 0 var(--ink);
  }
  #status b { white-space:nowrap; }

  #result {
    position:relative; display:flex; align-items:center; gap:14px; margin:26px 0 8px; padding:14px 20px;
    background:var(--card); border:4px solid var(--ink); border-radius:22px; font-size:1.3rem; font-weight:800;
  }
  #result:empty { display:none; }
  #result::before { content:"🦉"; font-size:2.6rem; }
  #result .score { flex:none; font-family:"Fredoka", sans-serif; background:var(--yellow); color:#1f2a44; border-radius:16px; padding:6px 12px; text-align:center; line-height:1.1; }
  #result .score small { display:block; font-size:.95rem; }

  #status {
    text-align:center; margin:18px auto 0; max-width:620px; padding:10px 16px; font-size:1.05rem;
    background:#fff7b0; color:#1f2a44; border-radius:6px; transform:rotate(-1deg); box-shadow:0 4px 10px var(--shadow);
  }
  body.contrast { background:#000; }
  body.contrast #status { background:#222; color:#fff; }

  .settings { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:22px; }
  .settings label, .settings select {
    font-size:1rem; font-weight:800; background:var(--card); color:var(--ink);
    border:3px solid var(--ink); border-radius:999px; padding:8px 14px; cursor:pointer;
  }
  .settings input { accent-color:var(--purple); transform:scale(1.2); margin-right:6px; }

  @media (max-width:600px) {
    .brand { font-size:1.4rem; } #eq { font-size:1.8rem; }
    button { font-size:1.1rem; padding:10px 18px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span>✏️</span> <span>Function</span> Tracer</div>
  <div id="dots" aria-label="Level progress"></div>
</header>
<main>
  <section class="eq-card">
    <span class="eq-label">Trace this!</span>
    <div id="eq">Loading…</div>
  </section>
  <div class="actions">
    <button id="clear">🧽 Clear</button>
    <button id="check">✅ Check</button>
    <button id="next">Next ➜</button>
  </div>
  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="board" width="800" height="600"></canvas>
    <div class="zoom">
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <span id="zoomLabel">Normal</span>
      <button id="zoomIn" aria-label="Zoom in">+</button>
    </div>
  </div>
  <div id="result" aria-live="polite"></div>
  <div id="status">
    <b>👍 Your thumb is the pen:</b> tap your pointer finger onto it and hold on the graph to draw ·
    <b>👌 Quick pinch</b> on a button to click ·
    <b>✊ Fist</b> for 1 second to clear
  </div>
  <div class="settings">
    <select id="kind" aria-label="Kind of equations">
      <option value="mix">📈 Lines + curves</option>
      <option value="line">📏 Lines only</option>
      <option value="curve">🌈 Curves only</option>
    </select>
    <label><input type="checkbox" id="usePinch" checked>Pinch to draw</label>
    <select id="tolerance" aria-label="Difficulty">
      <option value="1.5">🐢 Forgiving</option>
      <option value="0.75">🐇 Normal</option>
      <option value="0.4">🚀 Challenge</option>
    </select>
    <select id="penSpeed" aria-label="Pen speed while drawing">
      <option value="0.25">🐌 Steady pen</option>
      <option value="0.4" selected>✍️ Normal pen</option>
      <option value="0.65">⚡ Fast pen</option>
    </select>
    <label><input type="checkbox" id="snap" checked>Snap to clean shape</label>
    <label><input type="checkbox" id="contrast">High contrast</label>
  </div>
</main>
<div id="handPointer"></div>
<div id="toast" role="status"></div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const ctx = $("board").getContext("2d");
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();

// ---------- View & zoom ----------
// The canvas is always 800×600 pixels; zoom (the − / + buttons or keys) changes how many graph units fit on it.
// The drawing is saved in graph units, so it stays in the right place when you zoom.
const W = 800, H = 600;
const ZOOMS = [
  { name: "Close",  half: 3.5, step: 1 },   // shows −3.5 … 3.5
  { name: "Normal", half: 5,   step: 1 },   // shows −5 … 5
  { name: "Far",    half: 8,   step: 2 },   // shows −8 … 8, numbers every 2
];
let zoomIdx = 1, XMIN, XMAX, YMIN, YMAX, STEP;
function setZoom(i) {
  zoomIdx = Math.max(0, Math.min(ZOOMS.length - 1, i));
  const z = ZOOMS[zoomIdx];
  XMIN = YMIN = -z.half; XMAX = YMAX = z.half; STEP = z.step;
  $("zoomLabel").textContent = z.name;
  $("zoomIn").disabled = zoomIdx === 0;
  $("zoomOut").disabled = zoomIdx === ZOOMS.length - 1;
}
const toPx = (x, y) => [(x - XMIN) / (XMAX - XMIN) * W, H - (y - YMIN) / (YMAX - YMIN) * H];
const toGraph = (px, py) => [XMIN + px / W * (XMAX - XMIN), YMIN + (H - py) / H * (YMAX - YMIN)];

// ---------- Random equations ----------
// Every equation is a list of pieces, so piecewise functions can be added later.
// Values are kept small so the whole graph is visible even at "Close" zoom.
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const coefText = m => ({ "1": "", "-1": "−", "0.5": "½", "-0.5": "−½" }[String(m)] ?? `${m < 0 ? "−" : ""}${Math.abs(m)}`);
const plusConst = b => (b === 0 ? "" : ` ${b < 0 ? "−" : "+"} ${Math.abs(b)}`);

function makeLine() {                                       // y = mx + b
  const m = pick([-3, -2, -1, -0.5, 0.5, 1, 2, 3]), b = randInt(-3, 3);
  return { label: `y = ${coefText(m)}x${plusConst(b)}`, snap: "line",
           pieces: [{ f: x => m * x + b, xmin: -10, xmax: 10 }] };
}
function makeFlat() {                                       // y = c
  const c = pick([-3, -2, -1, 1, 2, 3]);
  return { label: `y = ${c < 0 ? "−" : ""}${Math.abs(c)}`, snap: "line",
           pieces: [{ f: () => c, xmin: -10, xmax: 10 }] };
}
function makeCurve() {                                      // y = ±(x − h)² + k
  const a = pick([1, -1]), h = pick([-2, -1, 0, 0, 1, 2]);
  const k = a > 0 ? randInt(-3, 1) : randInt(-1, 3);        // keep the turning point on screen
  const inner = h === 0 ? "x²" : `(x ${h > 0 ? "−" : "+"} ${Math.abs(h)})²`;
  return { label: `y = ${a < 0 ? "−" : ""}${inner}${plusConst(k)}`, snap: "curve",
           pieces: [{ f: x => a * (x - h) ** 2 + k, xmin: -10, xmax: 10 }] };
}
function randomEquation(kind) {
  if (kind === "line") return Math.random() < 0.8 ? makeLine() : makeFlat();
  if (kind === "curve") return makeCurve();
  const r = Math.random();                                  // mix: 55% lines, 15% flat, 30% curves
  return r < 0.55 ? makeLine() : r < 0.7 ? makeFlat() : makeCurve();
}

// ---------- State ----------
let level = null;          // the current equation
let trace = [];            // A -> B contract: [{x, y, drawing}]
let cursor = null;         // smoothed cursor in pixels
let pinching = false, spaceHeld = false, revealed = false;
let wasDrawing = false;    // was the pen down on the previous frame?
let strokeStart = -1;      // index in `trace` where the current stroke began
let fistSince = 0, fistUsed = false;   // for "hold a fist to clear"
let pinchEndedAt = -Infinity;          // when the last pinch was released
let feedbackId = 0;
const ROUND = 5;           // progress dots: equations checked in this round of 5
let doneInRound = 0;

// ---------- Snapping (clean up a stroke when the pen lifts) ----------
// Nobody's hand is steady in the air, so when the pen lifts we work out what the student MEANT:
//   1. Steady the stroke: even out the spacing and blur away the shake (keeps the overall shape).
//   2. Recognise it from the student's OWN points: a straight line (any angle, even vertical),
//      a curve (a parabola y = a + bx + cx²), or a free shape. It never looks at the correct
//      answer or the equation type, so a wrong shape stays wrong — it just looks neater.
//   3. "Snap to clean shape" ON → replace the stroke with that clean line/curve.
//      OFF → keep the steadied stroke, pulled partway toward the shape it looks like.
const SHAPE = {
  spacing: 0.04,      // resample the stroke every 0.04 graph units
  blur: 0.15,         // blur away shake smaller than about this many graph units
  lineFit: 0.04,      // a line is "good" if the stroke wanders from it by < 4% of the stroke's size…
  lineFloor: 0.1,     // …or by less than 0.1 graph units (short strokes)
  curveBetter: 0.6,   // a curve must fit at least 40% better than a line…
  curveFit: 0.06,     // …and the stroke wanders from that curve by < 6% of its size…
  bend: 0.065,        // …and bulge away from a straight chord by > 6.5% of its size (arms swinging in an
                      //    arc make straight lines bow by up to ~5%, and those should stay lines)
  bendIfNotLine: 0.05,// if it clearly isn't a line, a 5% bulge is enough
  bendFloor: 0.2,     // and any curve must bulge by at least 0.2 graph units (bigger than hand shake)
  pullOff: 0.6,       // snap OFF: move the steadied stroke 60% of the way toward the recognised shape
};
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const rms = a => Math.sqrt(mean(a.map(v => v * v)));

// Evenly spaced points along the stroke (removes repeats and speed differences).
function resample(pts, spacing) {
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    let a = pts[i - 1]; const b = pts[i], seg = Math.hypot(b.x - a.x, b.y - a.y);
    if (seg === 0) continue;
    let t = spacing - carry;
    while (t <= seg) { out.push({ x: a.x + (b.x - a.x) * t / seg, y: a.y + (b.y - a.y) * t / seg }); t += spacing; }
    carry = seg - (t - spacing);
  }
  const last = pts[pts.length - 1];
  if (Math.hypot(last.x - out.at(-1).x, last.y - out.at(-1).y) > spacing * 0.3) out.push({ x: last.x, y: last.y });
  return out;
}
// Gaussian blur along the stroke. The ends are held in place so the stroke doesn't shrink.
function blur(pts, sigmaPts) {
  if (sigmaPts < 0.5 || pts.length < 3) return pts.map(p => ({ ...p }));
  const r = Math.ceil(sigmaPts * 2.5), w = [];
  for (let k = -r; k <= r; k++) w.push(Math.exp(-(k * k) / (2 * sigmaPts * sigmaPts)));
  return pts.map((p, i) => {
    const reach = Math.min(r, i, pts.length - 1 - i);       // shrink the window near the ends
    let sx = 0, sy = 0, sw = 0;
    for (let k = -reach; k <= reach; k++) { const q = pts[i + k], wk = w[k + r]; sx += wk * q.x; sy += wk * q.y; sw += wk; }
    return { x: sx / sw, y: sy / sw };
  });
}
// Best straight line through the points, measuring distance at right angles (works for steep lines too).
function fitLine(pts) {
  const cx = mean(pts.map(p => p.x)), cy = mean(pts.map(p => p.y));
  let sxx = 0, syy = 0, sxy = 0;
  for (const p of pts) { const dx = p.x - cx, dy = p.y - cy; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  const ang = 0.5 * Math.atan2(2 * sxy, sxx - syy), ux = Math.cos(ang), uy = Math.sin(ang);
  const along = p => (p.x - cx) * ux + (p.y - cy) * uy;
  const project = p => { const t = along(p); return { x: cx + t * ux, y: cy + t * uy }; };
  const err = rms(pts.map(p => (p.x - cx) * -uy + (p.y - cy) * ux));
  return { err, project, along, at: t => ({ x: cx + t * ux, y: cy + t * uy }) };
}
// Best parabola y = a + bx + cx², if the stroke moves steadily left→right (or right→left).
function fitCurve(pts) {
  const xs = pts.map(p => p.x), lo = Math.min(...xs), hi = Math.max(...xs), span = hi - lo;
  if (span < 0.5) return null;                                // too narrow to be a y = f(x) curve
  // Does it double back on itself (not a function)? Judged on a very blurred copy, so shake on the
  // steep parts of a U doesn't count as going backwards.
  const broad = blur(pts, 0.5 / SHAPE.spacing).map(p => p.x);
  let travel = 0;
  for (let i = 1; i < broad.length; i++) travel += Math.abs(broad[i] - broad[i - 1]);
  if (travel > (Math.max(...broad) - Math.min(...broad)) * 1.2) return null;
  const coef = fitPolynomial(xs, pts.map(p => p.y), 2);
  if (!coef) return null;
  const f = x => coef[0] + coef[1] * x + coef[2] * x * x;
  const fp = x => coef[1] + 2 * coef[2] * x;
  const err = rms(pts.map(p => (p.y - f(p.x)) / Math.hypot(1, fp(p.x))));   // right-angle distance (approx.)
  const chord = (x0 => { const y0 = f(lo), y1 = f(hi), L = Math.hypot(span, y1 - y0);   // biggest bulge from the chord
    let m = 0;
    for (let i = 0; i <= 40; i++) { const x = lo + span * i / 40;
      m = Math.max(m, Math.abs((x - lo) * (y1 - y0) - (f(x) - y0) * span) / L); }
    return m; })();
  return { err, f, lo, hi, bulge: chord };
}
// What is this stroke? → { kind: "line" | "curve" | "free", clean: points of the clean shape }
function recognise(pts) {
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const size = Math.hypot(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  const line = fitLine(pts), curve = fitCurve(pts);
  const lineOk = line.err < Math.max(SHAPE.lineFit * size, SHAPE.lineFloor);
  const curveFits = curve && curve.err < SHAPE.curveFit * size && curve.err < line.err * SHAPE.curveBetter;
  const bends = curve && curve.bulge > Math.max(SHAPE.bendFloor, (lineOk ? SHAPE.bend : SHAPE.bendIfNotLine) * size);
  if (curveFits && bends) {                                   // a real bend, not a slightly bowed line
    const n = Math.max(2, Math.round((curve.hi - curve.lo) / SHAPE.spacing));
    const clean = Array.from({ length: n + 1 }, (_, i) => { const x = curve.lo + (curve.hi - curve.lo) * i / n; return { x, y: curve.f(x) }; });
    if (xs[0] > xs.at(-1)) clean.reverse();                   // keep the direction it was drawn in
    return { kind: "curve", clean, toward: p => ({ x: p.x, y: curve.f(p.x) }) };
  }
  if (lineOk) {
    const ts = pts.map(line.along), t0 = ts[0], t1 = ts.at(-1);
    const a = Math.min(...ts), b = Math.max(...ts), n = Math.max(2, Math.round((b - a) / SHAPE.spacing));
    const clean = Array.from({ length: n + 1 }, (_, i) => line.at(a + (b - a) * i / n));
    if (t0 > t1) clean.reverse();
    return { kind: "line", clean, toward: line.project };
  }
  return { kind: "free", clean: pts, toward: p => p };
}
// Clean up trace[start…] (the stroke that just finished) in place.
function snapStroke(start) {
  if (start < 0) return;
  let end = start;
  while (end + 1 < trace.length && trace[end + 1].drawing) end++;
  const raw = trace.slice(start, end + 1);
  if (raw.length < 3) return;
  let pts = resample(raw, SHAPE.spacing);
  pts = blur(pts, SHAPE.blur / SHAPE.spacing);
  let out = pts, kind = "free";
  if (pts.length >= 8) {
    const shape = recognise(pts); kind = shape.kind;
    out = $("snap").checked ? shape.clean
      : pts.map(p => { const q = shape.toward(p); return { x: p.x + SHAPE.pullOff * (q.x - p.x), y: p.y + SHAPE.pullOff * (q.y - p.y) }; });
  }
  trace.splice(start, end - start + 1, ...out.map(p => ({ x: p.x, y: p.y, drawing: true })));
  lastShape = kind;
  lastStroke = { start, end: start + out.length - 1, at: performance.now() };
}
let lastShape = null;      // what the last stroke was recognised as (handy when tuning)
let lastStroke = null;     // { start, end, at } of the last cleaned-up stroke, so a new stroke can join it

// Starting a new stroke right where the last one ended (soon after) carries on the SAME stroke,
// so a line drawn in two goes is recognised as one line instead of two crooked pieces.
const JOIN = { dist: 0.35, ms: 4000 };   // within 0.35 graph units and 4 seconds
function joinStroke(penAt) {
  const s = lastStroke;
  if (!s || performance.now() - s.at > JOIN.ms || !trace[s.end]?.drawing) return -1;
  const tail = trace[s.end];
  if (Math.hypot(tail.x - penAt.x, tail.y - penAt.y) > JOIN.dist) return -1;
  trace.splice(s.end + 1, trace.length - 1 - (s.end + 1));   // drop the hover points between the two strokes
  return s.start;
}

// Least squares polynomial: coefficients [c0, c1, c2…] meaning y = c0 + c1·x + c2·x².
function fitPolynomial(xs, ys, degree) {
  const n = degree + 1;
  const A = Array.from({ length: n }, (_, j) =>
    Array.from({ length: n }, (_, k) => xs.reduce((s, x) => s + x ** (j + k), 0)));
  const b = Array.from({ length: n }, (_, j) => xs.reduce((s, x, i) => s + ys[i] * x ** j, 0));
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-9) return null;               // not enough spread to fit
    [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < n; k++) A[r][k] -= f * A[c][k];
      b[r] -= f * b[c];
    }

  return b.map((v, i) => v / A[i][i]);
}
function finishStroke() {                                     // pen lifted (or Check pressed)
  if (wasDrawing) snapStroke(strokeStart);
  wasDrawing = false; strokeStart = -1;
}

// ---------- Scoring (Person B) ----------
// Score = how CLOSE your ink is to the graph (precision) combined with how much of the
// graph you COVERED (coverage), times a penalty for lots of extra ink.
// Filling the screen covers everything, but most of that ink is far away → low precision → low score.
const closeness = (d, tol) => (d <= tol / 2 ? 1 : Math.max(0, 1 - (d - tol / 2) / tol)); // 1 = on it, 0 = far
const nearestDist = (q, pts) => pts.reduce((m, p) => Math.min(m, Math.hypot(p.x - q.x, p.y - q.y)), Infinity);
const f1 = (p, r) => (p + r === 0 ? 0 : (2 * p * r) / (p + r));   // high only when BOTH are high
const r2 = v => Math.round(v * 100) / 100;

function curveSamples(pc) {                                   // points along the visible part of the graph
  const lo = Math.max(pc.xmin, XMIN), hi = Math.min(pc.xmax, XMAX), N = 400, pts = [];
  for (let i = 0; i <= N; i++) {
    const x = lo + (hi - lo) * i / N, y = pc.f(x);
    if (y >= YMIN && y <= YMAX) pts.push({ x, y, i });
  }
  return pts;
}
function curveLength(pts) {
  let len = 0;
  for (let j = 1; j < pts.length; j++)
    if (pts[j].i === pts[j - 1].i + 1) len += Math.hypot(pts[j].x - pts[j - 1].x, pts[j].y - pts[j - 1].y);
  return len;
}
function slope(xs, ys) {
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  return den === 0 ? 0 : num / den;
}

function score(trace, level, tol) {
  // 1. Turn the drawing into small ink segments, each with a length.
  const segs = [];
  for (let i = 1; i < trace.length; i++) {
    const a = trace[i - 1], b = trace[i];
    if (!a.drawing || !b.drawing) continue;
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len > 0) segs.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, len });
  }
  const inkLen = segs.reduce((s, g) => s + g.len, 0);
  const curves = level.pieces.map(curveSamples);
  const graphLen = curves.reduce((s, c) => s + curveLength(c), 0);
  const empty = mistake => ({ overall: 0, precision: 0, coverage: 0, inkRatio: 0,
                              pieces: level.pieces.map(() => ({ score: 0, mistake })) });
  if (graphLen === 0) return empty("off_screen");
  if (inkLen < 0.3) return empty("missing_piece");

  // 2. Precision: what share of the ink (by length) is close to the graph.
  for (const g of segs) g.d = Math.min(...curves.map(c => nearestDist(g, c)));
  const precision = segs.reduce((s, g) => s + g.len * closeness(g.d, tol), 0) / inkLen;

  // 3. Extra ink: tracing over the line up to 1.5× its length is free; beyond that costs points.
  const inkRatio = inkLen / graphLen;
  const efficiency = inkRatio <= 1.5 ? 1 : 1.5 / inkRatio;

  // 4. Coverage per piece: split the graph into 20 parts; each part counts if ink is close to it.
  const pieces = level.pieces.map((pc, idx) => {
    const c = curves[idx];
    if (c.length < 2) return { score: 0, mistake: "off_screen" };
    const BINS = 20, best = new Array(BINS).fill(0);
    c.forEach((p, j) => {
      const bin = Math.min(BINS - 1, Math.floor((j / c.length) * BINS));
      best[bin] = Math.max(best[bin], closeness(nearestDist(p, segs), tol));
    });
    const coverage = best.reduce((a, b) => a + b, 0) / BINS;

    // 5. Facts for feedback, from ink within this piece's left-right range.
    const lo = c[0].x, hi = c[c.length - 1].x;
    const mine = segs.filter(g => g.x >= lo && g.x <= hi);
    if (mine.length < 3) return { score: 0, mistake: "missing_piece", coverage: r2(coverage) };
    const xs = mine.map(g => g.x);
    const userSlope = slope(xs, mine.map(g => g.y)), trueSlope = slope(xs, xs.map(pc.f));
    const w = mine.reduce((s, g) => s + g.len, 0);
    const avgErr = mine.reduce((s, g) => s + g.len * g.d, 0) / w;
    const avgOffset = mine.reduce((s, g) => s + g.len * (g.y - pc.f(g.x)), 0) / w;   // + = drawn too high

    let mistake = null;
    if (Math.abs(trueSlope) > 0.2 && Math.sign(userSlope) !== Math.sign(trueSlope)) mistake = "wrong_direction";
    else if (inkRatio > 2.5 || (inkRatio > 2 && precision < 0.5)) mistake = "too_much";
    else if (precision < 0.6) mistake = "off_target";
    else if (coverage < 0.6) mistake = "incomplete";

    return {
      score: Math.round(100 * f1(precision, coverage) * efficiency), mistake,
      userSlope: r2(userSlope), trueSlope: r2(trueSlope), avgErr: r2(avgErr), avgOffset: r2(avgOffset),
      coverage: r2(coverage), precision: r2(precision), inkRatio: r2(inkRatio),
    };
  });
  const coverage = pieces.reduce((s, p) => s + (p.coverage ?? 0), 0) / pieces.length;
  const overall = Math.round(100 * f1(precision, coverage) * efficiency);
  return { pieces, overall, precision: r2(precision), coverage: r2(coverage), inkRatio: r2(inkRatio) }; // B -> C
}

// ---------- Feedback (Person C) ----------
// Claude explains the mistake; these fixed messages are the backup if the server or Claude is unavailable.
const MESSAGES = {
  wrong_direction: "Your line went the opposite way. Look at the number in front of x: positive goes up, negative goes down.",
  too_much: "You drew lots of extra lines. Try one smooth, careful trace along the graph.",
  off_target: "Good try! Your drawing is a bit away from the graph. Check where it crosses the y-axis.",
  incomplete: "Nice start! Try drawing across more of the graph.",
  missing_piece: "I didn't see a drawing yet. Pinch (or hold space) and trace the graph.",
  off_screen: "The graph is off the screen. Try zooming out with the − button.",
};
const pct = v => `${Math.round(v * 100)}%`;
async function showResult(r) {
  const id = ++feedbackId;
  const m = r.pieces.find(p => p.mistake)?.mistake;
  const fallback = m ? MESSAGES[m]
    : r.overall >= 80 ? "Amazing — that's the graph!"
    : "Good effort! Try one smooth trace right on top of the graph.";
  const stars = r.overall >= 85 ? "⭐⭐⭐" : r.overall >= 60 ? "⭐⭐" : r.overall >= 30 ? "⭐" : "💪";
  const breakdown = r.overall || r.precision
    ? `On the graph: ${pct(r.precision)} · Graph covered: ${pct(r.coverage)}` +
      (r.inkRatio > 1.5 ? " · Extra lines lowered your score" : "")
    : "";
  const show = text => {
    if (id !== feedbackId) return;
    const badge = document.createElement("div"); badge.className = "score";
    badge.innerHTML = `${r.overall}<small>${stars}</small>`;
    const msg = document.createElement("div"); msg.textContent = text;
    if (breakdown) {
      const small = document.createElement("span"); small.className = "breakdown"; small.textContent = breakdown;
      msg.append(small);
    }
    $("result").replaceChildren(badge, msg);
  };
  if (m === "missing_piece" || m === "off_screen") return show(fallback);   // no need to ask Claude
  show("Thinking…");
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const resp = await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ equation: level.label, overall: r.overall, pieces: r.pieces }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const { text } = await resp.json();
    show(text || fallback);
  } catch (err) {
    console.warn("Claude feedback unavailable, using backup message:", err.message);
    show(fallback);
  }
}

// ---------- Drawing ----------
function drawGrid() {
  ctx.clearRect(0, 0, W, H);                                  // wipe the last frame completely
  ctx.fillStyle = css("--bg"); ctx.globalAlpha = 0.6; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; // webcam shows faintly through
  ctx.lineWidth = 1; ctx.strokeStyle = css("--grid");
  for (let v = Math.ceil(XMIN); v <= XMAX; v++) {             // a grid line every 1 unit
    const [px] = toPx(v, 0); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
    const [, py] = toPx(0, v); ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
  }
  ctx.lineWidth = 3; ctx.strokeStyle = css("--axis");
  const [ox, oy] = toPx(0, 0);
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();
  drawAxisNumbers(ox, oy);
}
// Numbers along each axis (every STEP units), plus "x" and "y" names.
// Each label gets an outline in the background color so it stays readable over grid lines.
function drawAxisNumbers(ox, oy) {
  const fmt = v => (v < 0 ? "−" + -v : String(v));          // real minus sign reads better than "-"
  ctx.font = "bold 18px Nunito, system-ui, sans-serif";
  ctx.lineWidth = 5; ctx.lineJoin = "round";
  ctx.strokeStyle = css("--bg"); ctx.fillStyle = css("--ink");
  const label = (text, x, y, align, baseline) => {
    ctx.textAlign = align; ctx.textBaseline = baseline;
    ctx.strokeText(text, x, y); ctx.fillText(text, x, y);
  };
  for (let v = Math.ceil(XMIN / STEP) * STEP; v < XMAX; v += STEP) {
    if (v === 0 || Math.abs(v) > XMAX - 0.25) continue;      // skip 0 and labels at the very edge
    const [px] = toPx(v, 0);
    label(fmt(v), px, oy + 6, "center", "top");             // under the x-axis
    const [, py] = toPx(0, v);
    label(fmt(v), ox - 8, py, "right", "middle");           // left of the y-axis
  }
  label("0", ox - 8, oy + 6, "right", "top");
  ctx.font = "italic bold 22px Fredoka, system-ui, sans-serif";
  label("x", W - 10, oy - 8, "right", "bottom");
  label("y", ox + 10, 8, "left", "top");
}
function drawAnswer() {
  ctx.lineWidth = 5; ctx.strokeStyle = css("--answer"); ctx.setLineDash([12, 8]);
  for (const pc of level.pieces) {
    ctx.beginPath(); let started = false;
    const lo = Math.max(pc.xmin, XMIN), hi = Math.min(pc.xmax, XMAX);
    for (let i = 0; i <= 400; i++) {
      const x = lo + (hi - lo) * i / 400, y = pc.f(x);
      if (y < YMIN - 1 || y > YMAX + 1) { started = false; continue; }
      const [px, py] = toPx(x, y);
      started ? ctx.lineTo(px, py) : ctx.moveTo(px, py); started = true;
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function drawTrace() {
  ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = css("--trace");
  ctx.beginPath();
  for (let i = 0; i < trace.length; i++) {
    const p = trace[i]; if (!p.drawing) continue;
    const [px, py] = toPx(p.x, p.y);
    (i > 0 && trace[i - 1].drawing) ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}
function drawCursor(drawing) {
  if (!cursor) return;
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, drawing ? 14 : 18, 0, Math.PI * 2);
  ctx.lineWidth = 4; ctx.strokeStyle = css("--cursor"); ctx.fillStyle = css("--cursor");
  drawing ? ctx.fill() : ctx.stroke();
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 3.5, 0, Math.PI * 2);   // center dot: exactly where the pen is
  ctx.fillStyle = css("--ink"); ctx.fill();
  if (mode === "fist" && !fistUsed) {                         // ring fills up while holding a fist
    const t = fistProgress(performance.now());
    ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 28, -Math.PI / 2, -Math.PI / 2 + t * 2 * Math.PI);
    ctx.lineWidth = 6; ctx.strokeStyle = css("--cursor"); ctx.stroke();
  }
}
function drawTakeover() {                                     // ring fills while a new hand waits to take control
  if (!challenger?.lm) return;
  const c = canvasPointFor(challenger.lm[4]);
  if (!c) return;                                             // only drawn when that hand is over the graph
  const t = Math.min(1, (performance.now() - challenger.since) / challenger.wait);
  ctx.beginPath(); ctx.arc(c.x, c.y, 22, 0, Math.PI * 2);
  ctx.lineWidth = 3; ctx.strokeStyle = css("--axis"); ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(c.x, c.y, 22, -Math.PI / 2, -Math.PI / 2 + t * 2 * Math.PI);
  ctx.lineWidth = 6; ctx.strokeStyle = css("--cursor"); ctx.stroke();
}
function render(drawing = false) {
  drawGrid(); if (revealed) drawAnswer(); drawTrace(); drawCursor(drawing); drawTakeover();
}

// ---------- Hand tracking (Person A) ----------
// The MAIN hand's thumb tip is a pointer for the whole page (the thumb stays still while the
// pointer finger comes down to pinch, so lines are steadier):
//   pinch & hold on the graph = draw · quick pinch on a button = click ·
//   fist for 1 second = clear
// The closest hand to the camera becomes the main hand; background people are ignored. Another hand
// takes over after 2 s once the main hand is gone, or after 1 s if it is clearly closer (a ring fills
// while it waits). If the main hand is gone for 1.5 s, the game forgets it and picks the closest hand.
//
// Tuning knobs (test these on a real webcam and adjust):
const HAND = {
  edge: 0.12,               // ignore this much of each camera edge, so you can reach every corner of the page
  pinchOn: 0.3, pinchOff: 0.45,   // pinch closes below / opens above this (thumb–index gap ÷ hand size)
  releaseMs: 150,                 // fingers must stay open this long to lift the pen (fast moves blur the
                                  //   camera image, so a pinch can look open for a frame or two)
  lostGraceMs: 250,               // if the camera loses your hand for less than this, carry on as if it hadn't
  tapMs: 600, tapMovePx: 50,      // a "click" = pinch released within 600 ms, moving less than 50 px
  fistMs: 1000,                   // hold a fist this long to clear (after it's confirmed)
  fistConfirmMs: 300,             // a fist must be seen this long before it counts (filters quick blips)
  fistAfterPinchMs: 600,          // no fist for this long after a pinch ends (hands curl as they relax)
  fistCurl: 1.1,                  // fingertip must be within this × the knuckle's distance from the wrist
};

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
// A finger is "extended" when its tip is farther from the wrist than its middle joint.
const extended = (lm, tip, joint) => dist(lm[tip], lm[0]) > dist(lm[joint], lm[0]);
// "Curled" = fingertip pulled right down to its knuckle (about as close to the wrist as the knuckle).
// The pointer finger tells a pinch from a fist: in a pinch it reaches out to the thumb, in a fist
// it's curled. So a curled pointer finger is never a pinch, and a fist needs all four curled.
const curled = (lm, tip, knuckle) => dist(lm[tip], lm[0]) < HAND.fistCurl * dist(lm[knuckle], lm[0]);
const isFist = lm => [[8, 5], [12, 9], [16, 13], [20, 17]].every(([tip, knuckle]) => curled(lm, tip, knuckle));
const pinchRatio = lm => dist(lm[4], lm[8]) / dist(lm[0], lm[9]);   // thumb–index gap relative to hand size

// ----- Main hand: who controls the pen -----
// MediaPipe doesn't say which hand is which from frame to frame, so we follow the main hand
// by where it was last seen, its size, and whether it is a left or right hand.
// "The person in front wins": a hand's size on camera tells us how close it is. Hands that are
// much smaller than the closest hand (people in the background) are ignored completely.
const HANDS = {
  takeoverMs: 2000,   // a new hand must wait this long to take control while the main hand is gone…
  closerMs: 1000,     // …or this long if it is clearly closer to the camera than the main hand
  lostMs: 1000,       // the main hand can vanish this long (tracking blink) and still be recognized
  forgetMs: 1500,     // after this long without the main hand, forget it and pick the closest hand fresh
  rememberMs: 6000,   // for this long after the main hand leaves, much smaller hands still count as background
  matchDist: 0.35,    // how far (fraction of the screen) the main hand can move between sightings
  sameSize: 1.6,      // a hand more than 1.6× bigger/smaller than the main hand is not the same hand
  closer: 1.35,       // a hand 1.35× bigger than the main hand counts as "clearly closer"
  background: 0.6,    // hands smaller than 60% of the closest hand are background people: ignored
  minSize: 30,        // hands smaller than this (camera pixels) are too far away to use at all
};
// Hand size in camera pixels: wrist → middle knuckle, or knuckle width, whichever is bigger
// (so it stays steady when the hand turns sideways or tilts). Bigger = closer to the camera.
const px = p => ({ x: p.x * 640, y: p.y * 480 });            // camera coords → camera pixels (true proportions)
const handSize = lm => Math.max(dist(px(lm[0]), px(lm[9])), dist(px(lm[5]), px(lm[17])));
let main = null;           // { pos, side, size, seen } of the hand in control; null = pick the closest hand
let challenger = null;     // { pos, since, lm } a hand waiting to take control (drives the takeover ring)

let lastMain = null;       // { size, seen } of the most recent main hand, so a background hand can't
                           // grab the pen just because you lowered your hand for a moment

// Keep only hands of the person in front, closest first.
function frontHands(hands, now) {
  const sized = hands.map(h => ({ ...h, size: handSize(h.lm) })).filter(h => h.size >= HANDS.minSize);
  const remembered = lastMain && now - lastMain.seen < HANDS.rememberMs ? lastMain.size : 0;
  const biggest = Math.max(remembered, ...sized.map(h => h.size));
  return sized.filter(h => h.size >= biggest * HANDS.background).sort((a, b) => b.size - a.size);
}

function pickMainHand(hands, now) {          // hands: front hands, closest first → the main hand, or null
  const follow = h => {
    main = { pos: h.lm[9], side: h.side, size: h.size, seen: now };
    lastMain = { size: h.size, seen: now };
    return h;
  };
  const take = h => {                                         // a different hand takes control: drop the old pen state
    cursor = null; pointer = null; pinching = false; pinchStart = null; fistSince = 0; challenger = null;
    return follow(h);
  };
  if (main && now - main.seen > HANDS.forgetMs) main = null;  // main hand gone a while: recalibrate
  if (!hands.length) { challenger = null; return null; }
  if (!main) return take(hands[0]);                           // nobody in control: the closest hand, no waiting

  let matched = null, bestCost = Infinity;                    // find the main hand again
  if (now - main.seen <= HANDS.lostMs) {
    for (const h of hands) {
      const ratio = Math.max(h.size, main.size) / Math.min(h.size, main.size);
      if (ratio > HANDS.sameSize) continue;                   // too different in size to be the same hand
      const cost = dist(h.lm[9], main.pos) + (h.side !== main.side ? 0.3 : 0);
      if (cost < bestCost) { matched = h; bestCost = cost; }
    }
    if (bestCost >= HANDS.matchDist) matched = null;
  }

  // Who could take over? While the main hand is visible, only a clearly closer hand.
  // While it's gone, the closest other hand (even if other hands are on screen too).
  const others = hands.filter(h => h !== matched);
  const rival = matched ? others.find(h => h.size >= matched.size * HANDS.closer) : others[0];
  if (!rival) { challenger = null; return matched ? follow(matched) : null; }
  if (!challenger || dist(rival.lm[9], challenger.pos) > HANDS.matchDist) {
    challenger = { since: now };                              // a new hand started waiting
    toast(matched ? "✋ Closer hand: hold still to take over" : "✋ New hand: hold still to take over");
  }
  challenger.pos = rival.lm[9]; challenger.lm = rival.lm;
  challenger.wait = matched ? HANDS.closerMs : HANDS.takeoverMs;
  if (now - challenger.since >= challenger.wait) return take(rival);
  return matched ? follow(matched) : null;                    // the main hand keeps the pen until the rival wins
}

let landmarker, lastVideoTime = -1;
let pointer = null;              // smoothed pointer position on the page (viewport pixels)
let mode = "none";               // "point" | "fist" | "none"
let pinchStart = null;           // where/when the current pinch began: {t, x, y, onCanvas}
let hoverEl = null;

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = "none"), 1200);
}

// Camera point → page position (mirrored, like a mirror), and → graph position if it's over the graph.
function viewportPointFor(p) {
  const map = (v, size) => Math.min(size, Math.max(0, (v - HAND.edge) / (1 - 2 * HAND.edge) * size));
  return { x: map(1 - p.x, innerWidth), y: map(p.y, innerHeight) };
}
function canvasPointFor(p) {
  const v = viewportPointFor(p), r = $("board").getBoundingClientRect();
  if (document.elementFromPoint(v.x, v.y) !== $("board")) return null;
  return { x: (v.x - r.left) / r.width * W, y: (v.y - r.top) / r.height * H };
}

// ----- Steady pen -----
// 1. A "One Euro" filter steadies the hand: lots of smoothing when you move slowly (that's when
//    shake shows), little when you move fast (so the pointer doesn't lag behind big moves).
// 2. While the pen is down, how far the pen moves depends on how FAST your hand moves (like a mouse):
//    slow, careful movement (and shake) is scaled down to the "Pen speed" setting, so it stays tiny;
//    a quick sweep moves the pen 1:1, so you can still draw across the whole graph at a normal pace.
//    After you lift the pen it stays where you stopped while it's over the graph; once it leaves the
//    graph it glides back under your hand, so you can still reach every button.
const PEN = {
  pointFilter: { minCutoff: 1.5, beta: 0.006 },   // pointing at buttons: responsive
  drawFilter:  { minCutoff: 1.0, beta: 0.006 },   // drawing: a bit steadier (lower = smoother, more lag)
  fastGain: 1.0,          // a quick sweep moves the pen 1:1 with the hand
  slowSpeed: 0.03,        // hand speeds (screen widths per second) at or below this use the slow pen…
  fastSpeed: 0.18,        // …at or above this (a relaxed sweep) use fastGain; in between it blends
  returnMs: 250,          // off the graph, the pointer catches up with your hand over ~this long
};
const slowGain = () => parseFloat($("penSpeed").value);    // pen distance ÷ hand distance when moving slowly
function penGain(speed) {                                  // speed in screen widths per second
  const u = Math.min(1, Math.max(0, (speed - PEN.slowSpeed) / (PEN.fastSpeed - PEN.slowSpeed)));
  return slowGain() + (PEN.fastGain - slowGain()) * u * u * (3 - 2 * u);
}
let handSpeed = 0;               // smoothed hand speed, screen widths per second
class OneEuro {                  // https://gery.casiez.net/1euro/ (one axis)
  reset() { this.x = this.dx = this.t = null; }
  filter(x, tSec, { minCutoff, beta }) {
    const alpha = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));
    if (this.x === null || this.x === undefined) { this.x = x; this.dx = 0; this.t = tSec; return x; }
    const dt = Math.max(1e-3, tSec - this.t); this.t = tSec;
    const dx = (x - this.x) / dt;
    this.dx += alpha(1, dt) * (dx - this.dx);                 // smoothed speed
    this.x += alpha(minCutoff + beta * Math.abs(this.dx), dt) * (x - this.x);
    return this.x;
  }
}
const steadyX = new OneEuro(), steadyY = new OneEuro();
let handAt = null;               // steadied hand position (viewport pixels), last frame
let penOffset = { x: 0, y: 0 };  // pointer − hand: grows while drawing slowly, shrinks to 0 after
let lastMoveT = 0;
const penIsDown = () => (pinching && !!pinchStart?.onCanvas) || spaceHeld;

// Move the page pointer to the thumb tip, and work out where that is on the graph (if over it).
function movePointer(tip, now) {
  const raw = viewportPointFor(tip);
  if (!pointer) { steadyX.reset(); steadyY.reset(); handAt = null; penOffset = { x: 0, y: 0 }; handSpeed = 0; }
  const down = penIsDown(), opts = down ? PEN.drawFilter : PEN.pointFilter;
  const hand = { x: steadyX.filter(raw.x, now / 1000, opts), y: steadyY.filter(raw.y, now / 1000, opts) };
  if (handAt) {
    const dt = Math.max(0, now - lastMoveT);
    const dx = hand.x - handAt.x, dy = hand.y - handAt.y;
    if (dt > 0) handSpeed += 0.5 * (Math.hypot(dx, dy) / innerWidth / (dt / 1000) - handSpeed);
    if (down) {                  // pen down: slow movement is scaled down, fast movement isn't
      const k = penGain(handSpeed) - 1;
      penOffset.x += k * dx; penOffset.y += k * dy;
    } else if (!cursor) {        // pen up and off the graph: glide back under the hand (to reach buttons)
      const decay = Math.exp(-dt / PEN.returnMs);
      penOffset.x *= decay; penOffset.y *= decay;
    }                            // pen up over the graph: stay put, so you can carry on from where you stopped
  }
  handAt = hand; lastMoveT = now;
  pointer = { x: Math.min(innerWidth, Math.max(0, hand.x + penOffset.x)),
              y: Math.min(innerHeight, Math.max(0, hand.y + penOffset.y)) };
  penOffset = { x: pointer.x - hand.x, y: pointer.y - hand.y };   // don't build up an offset past the screen edge
  const r = $("board").getBoundingClientRect();
  const under = document.elementFromPoint(pointer.x, pointer.y);
  cursor = under === $("board")
    ? { x: (pointer.x - r.left) / r.width * W, y: (pointer.y - r.top) / r.height * H }
    : null;                                                  // not over the graph (e.g. over a button)
}

// Click whatever is under a point: buttons, checkboxes (via their label), and dropdowns.
function clickableAt(x, y) {
  return document.elementFromPoint(x, y)?.closest("button, select, label") ?? null;
}
function clickAt(x, y) {
  const el = clickableAt(x, y);
  if (!el || el.disabled) return;
  if (el.tagName === "SELECT") {                              // a hand can't open a dropdown, so step to the next option
    el.selectedIndex = (el.selectedIndex + 1) % el.options.length;
    el.dispatchEvent(new Event("change"));
    toast(el.options[el.selectedIndex].textContent.trim());
  } else {
    el.click();
  }
}

// 0 → 1 as a confirmed fist is held; 1 = clear.
const fistProgress = now => Math.min(1, Math.max(0, (now - fistSince - HAND.fistConfirmMs) / HAND.fistMs));

function oneHand(lm, now) {
  movePointer(lm[4], now);                                    // thumb tip = pen and pointer
  // ✊ Fist = clear. A pinch always wins: no fist while pinching, or just after letting go of one,
  // and a fist has to be held steady for fistConfirmMs before it counts.
  if (!pinching && now - pinchEndedAt > HAND.fistAfterPinchMs && isFist(lm)) {
    if (!fistSince) fistSince = now;
    if (now - fistSince >= HAND.fistConfirmMs) {
      mode = "fist"; pinchStart = null;
      if (!fistUsed && fistProgress(now) >= 1) { clearDrawing(); fistUsed = true; toast("Cleared 🧽"); }
      return;
    }
  } else { fistSince = 0; fistUsed = false; }
  mode = "point";
  const wasPinching = pinching;
  const ratio = pinchRatio(lm), pointerCurled = curled(lm, 8, 5);   // thumb on a curled finger = fist, not pinch
  const open = ratio > HAND.pinchOff || pointerCurled;
  if (!pinching && ratio < HAND.pinchOn && !pointerCurled) { pinching = true; openSince = 0; }
  else if (pinching && open) {                                // only lift the pen once the fingers STAY open
    if (!openSince) openSince = now;
    if (now - openSince >= HAND.releaseMs) pinching = false;
  } else openSince = 0;
  if (pinching && !wasPinching) pinchStart = { t: now, x: pointer.x, y: pointer.y, onCanvas: !!cursor };
  if (!pinching && wasPinching) pinchEndedAt = now;
  if (!pinching && wasPinching && pinchStart) {               // pinch released: was it a quick tap?
    const quick = now - pinchStart.t < HAND.tapMs && dist(pointer, pinchStart) < HAND.tapMovePx;
    if (quick && !pinchStart.onCanvas) clickAt(pinchStart.x, pinchStart.y);
    pinchStart = null;
  }
}

let openSince = 0;               // when the fingers opened during a pinch (0 = they're closed)
let handSeenAt = -Infinity;      // when the main hand was last seen
function noHands() {
  mode = "none"; pointer = null; cursor = null; pinching = false; pinchStart = null; fistSince = 0; openSince = 0;
}

// Show the page pointer (hidden over the graph, where the graph's own cursor shows) and highlight what it would click.
function updatePointerUI() {
  const el = $("handPointer");
  const show = pointer && !cursor;
  el.style.display = show ? "block" : "none";
  if (show) {
    el.style.transform = `translate(${pointer.x}px, ${pointer.y}px)`;
    el.className = pinching ? "pinch" : "";
    el.textContent = mode === "fist" ? "✊" : "";
  }
  const target = show && mode === "point" ? clickableAt(pointer.x, pointer.y) : null;
  if (target !== hoverEl) {
    hoverEl?.classList.remove("hand-hover");
    target?.classList.add("hand-hover");
    hoverEl = target;
  }
}

async function start() {
  $("eq").textContent = "Starting camera…";
  const video = $("cam");
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  await new Promise(r => video.onloadeddata = r);
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(files, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    // Look for up to 4 hands so a background person can't use up the slots meant for yours;
    // the stricter confidences cut "ghost" hands (e.g. a hand resting in someone's lap).
    runningMode: "VIDEO", numHands: 4,
    minHandDetectionConfidence: 0.6, minHandPresenceConfidence: 0.6, minTrackingConfidence: 0.5,
  });
  newEquation();
  loop();
}

// One frame of hand input (also used by tests). hands = [{ lm, side }]
function step(allHands, now) {
  const hands = frontHands(allHands, now);                    // drop people in the background, closest first
  const mainHand = pickMainHand(hands, now);
  if (mainHand) { handSeenAt = now; oneHand(mainHand.lm, now); }  // only the main hand points, draws, and clicks
  else if (pointer && now - handSeenAt < HAND.lostGraceMs) {}     // tracking blink: keep the pen as it was
  else noHands();
  updatePointerUI();
}

function loop() {
  const video = $("cam");
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const now = performance.now();
    const res = landmarker.detectForVideo(video, now);
    const sides = res.handednesses ?? res.handedness ?? [];
    step((res.landmarks ?? []).map((lm, i) => ({ lm, side: sides[i]?.[0]?.categoryName })), now);
  }
  drawFrame();
  requestAnimationFrame(loop);
}

function drawFrame() {           // record the pen and redraw (also used by tests)
  // Draw only when the pinch started on the graph (so a click that drifts onto it doesn't draw).
  const drawing = !!cursor && !revealed &&
    (($("usePinch").checked && pinching && !!pinchStart?.onCanvas) || spaceHeld);
  if (cursor) {
    const [gx, gy] = toGraph(cursor.x, cursor.y);
    trace.push({ x: gx, y: gy, drawing });
    if (trace.length > 5000) {
      trace.shift(); if (strokeStart > 0) strokeStart--;
      if (lastStroke) { lastStroke.start--; lastStroke.end--; if (lastStroke.start < 0) lastStroke = null; }
    }
  }
  if (drawing && !wasDrawing) {                                                         // pen down
    const joined = joinStroke(trace.at(-1));
    strokeStart = joined >= 0 ? joined : trace.length - 1; wasDrawing = true;
  }
  else if (!drawing && wasDrawing) finishStroke();                                     // pen up → snap
  render(drawing);
}

// ---------- Controls ----------
function renderDots() {                  // green = checked this round, yellow = current equation
  $("dots").replaceChildren(...Array.from({ length: ROUND }, (_, j) => {
    const d = document.createElement("i");
    d.className = j < doneInRound ? "done" : j === doneInRound ? "now" : "";
    return d;
  }));
}
function clearDrawing() {                // same equation, fresh start (also lets you retry after Check)
  trace = []; revealed = false; feedbackId++; wasDrawing = false; strokeStart = -1; lastStroke = null;
  $("result").replaceChildren();
}
function newEquation() {
  if (doneInRound >= ROUND) doneInRound = 0;                  // start a new round of 5
  let next;
  do { next = randomEquation($("kind").value); } while (level && next.label === level.label);
  level = next; clearDrawing();
  $("eq").textContent = level.label;
  renderDots();
}
function check() {
  if (revealed || !level) return;                       // avoid repeat checks / repeat Claude calls
  finishStroke();                                       // snap a stroke still in progress
  const r = score(trace, level, parseFloat($("tolerance").value));
  console.log("score", r);
  revealed = true; showResult(r);
  doneInRound = Math.min(ROUND, doneInRound + 1); renderDots();
}
$("clear").onclick = clearDrawing;
$("next").onclick = newEquation;
$("kind").onchange = newEquation;
$("check").onclick = check;
$("zoomIn").onclick = () => setZoom(zoomIdx - 1);
$("zoomOut").onclick = () => setZoom(zoomIdx + 1);
$("contrast").onchange = e => document.body.classList.toggle("contrast", e.target.checked);
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { spaceHeld = true; e.preventDefault(); }
  if (e.code === "Enter") check();
  if (e.code === "KeyC" || e.code === "Backspace") clearDrawing();
  if (e.code === "KeyN") newEquation();
  if (e.code === "Equal" || e.code === "NumpadAdd") setZoom(zoomIdx - 1);
  if (e.code === "Minus" || e.code === "NumpadSubtract") setZoom(zoomIdx + 1);
});
addEventListener("keyup", e => { if (e.code === "Space") spaceHeld = false; });

setZoom(1);
start().catch(err => { $("eq").textContent = "Camera error"; $("status").textContent = err.message; });
</script>
</body>
</html>
