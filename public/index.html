<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Function Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fffdf7; --ink:#1f2a44; --grid:#cfe3f7; --axis:#5b6b8c; --trace:#7c3aed; --answer:#16a34a; --cursor:#f97316;
    --sky1:#dff3ff; --sky2:#fff4d6; --card:#ffffff; --shadow:#1f2a4422;
    --red:#ff6b6b; --yellow:#ffc93c; --green:#3ccf7a; --blue:#4d96ff; --purple:#9b5de5;
  }
  body.contrast {
    --bg:#000; --ink:#fff; --grid:#333; --axis:#ccc; --trace:#ffd400; --answer:#00e5ff; --cursor:#ff4fd8;
    --sky1:#000; --sky2:#000; --card:#111; --shadow:#0000;
    --red:#ff4fd8; --yellow:#ffd400; --green:#00e5ff; --blue:#ffd400; --purple:#ff4fd8;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:"Nunito", system-ui, sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 10% 15%, #ffffff99 0 60px, transparent 61px),
      radial-gradient(circle at 88% 10%, #ffffff99 0 80px, transparent 81px),
      linear-gradient(180deg, var(--sky1), var(--sky2));
    background-attachment:fixed;
  }
  /* One screen, no scrolling: a top bar (title · buttons · progress), then the graph as big as fits,
     with a side panel (equation, feedback, settings, tips) in the spare space beside it. */
  :root { --head:92px; --panel:330px; --gap:20px; }
  .top {
    height:var(--head); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:0 24px;
  }
  .brand { font-family:"Fredoka", sans-serif; font-weight:700; font-size:1.8rem; letter-spacing:.5px; white-space:nowrap; }
  #dots { justify-self:end; }
  main.app {
    display:flex; justify-content:center; align-items:flex-start; gap:var(--gap);
    height:calc(100dvh - var(--head)); padding:0 var(--gap) var(--gap);
  }
  .panel {
    width:var(--panel); flex:none; max-height:100%; overflow-y:auto; display:flex; flex-direction:column; gap:14px;
    padding:4px 4px 12px;   /* room for the cards' shadows */
  }
  .brand span:nth-child(1){color:var(--red)} .brand span:nth-child(2){color:var(--blue)}
  #dots { display:flex; gap:8px; }
  #dots i { width:16px; height:16px; border-radius:50%; background:var(--card); border:3px solid var(--ink); opacity:.35; }
  #dots i.done { background:var(--green); opacity:1; }
  #dots i.now { background:var(--yellow); opacity:1; transform:scale(1.25); }

  .eq-card {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:var(--card); border:4px solid var(--ink); border-radius:24px; padding:12px 16px;
    box-shadow:0 6px 0 var(--ink);
  }
  .eq-label { font-family:"Fredoka", sans-serif; font-size:1.1rem; background:var(--yellow); color:#1f2a44; padding:4px 14px; border-radius:999px; }
  #eq { font-family:"Fredoka", sans-serif; font-size:2.3rem; font-weight:700; color:var(--purple); text-align:center; }

  .actions { display:flex; justify-content:center; gap:14px; }
  button {
    font-family:"Fredoka", sans-serif; font-size:1.3rem; font-weight:600; padding:12px 26px;
    border-radius:18px; border:4px solid var(--ink); color:#1f2a44; cursor:pointer;
    box-shadow:0 5px 0 var(--ink); transition:transform .08s, box-shadow .08s;
  }
  button:hover { transform:translateY(-2px); box-shadow:0 7px 0 var(--ink); }
  button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  button:disabled { opacity:.4; cursor:default; transform:none; box-shadow:0 5px 0 var(--ink); }
  #prev { background:var(--purple); color:#fff; }
  #clear { background:var(--yellow); } #check { background:var(--green); } #next { background:var(--blue); color:#fff; }
  body.contrast button { color:#000; }

  #stage {   /* as big as fits: the full height below the top bar, or the width beside the panel */
    height:min(calc(100dvh - var(--head) - var(--gap) - 8px), calc((100vw - var(--panel) - 3 * var(--gap)) * 0.75));
    min-height:300px; aspect-ratio:4/3; flex:none; position:relative; overflow:hidden;
    border:5px solid var(--ink); border-radius:28px; background:var(--bg); box-shadow:0 8px 0 var(--ink);
  }
  #cam, #board { position:absolute; inset:0; width:100%; height:100%; }
  #cam { transform:scaleX(-1); opacity:.18; object-fit:cover; }

  /* Zoom controls float in the bottom-right corner of the graph */
  .zoom {
    position:absolute; right:12px; bottom:12px; z-index:2; display:flex; align-items:center; gap:6px;
    background:var(--card); border:3px solid var(--ink); border-radius:999px; padding:4px 6px;
  }
  .zoom button { width:44px; height:44px; padding:0; font-size:1.5rem; border-radius:50%; border-width:3px;
    background:var(--card); color:var(--ink); box-shadow:0 3px 0 var(--ink); }
  .zoom button:disabled { opacity:.3; cursor:default; transform:none; }
  #zoomLabel { font-family:"Fredoka", sans-serif; font-weight:600; min-width:4.2em; text-align:center; }
  #result .breakdown { display:block; font-size:.95rem; font-weight:600; opacity:.75; margin-top:4px; }

  /* Hand pointer: follows your index finger anywhere on the page */
  #handPointer {
    position:fixed; left:0; top:0; z-index:1000; width:38px; height:38px; margin:-19px 0 0 -19px;
    border:5px solid var(--cursor); border-radius:50%; pointer-events:none; display:none;
    background:#ffffff66; font-size:1.2rem; line-height:28px; text-align:center;
  }
  #handPointer.pinch { background:var(--cursor); }
  .hand-hover { outline:5px solid var(--cursor); outline-offset:3px; }
  /* Confetti covers the page but never blocks clicks (or the hand pointer) */
  #confetti { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:999; display:none; }
  #toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:1001; display:none;   /* bottom: never covers the score */
    font-family:"Fredoka", sans-serif; font-size:1.4rem; font-weight:600; padding:10px 22px;
    background:var(--card); color:var(--ink); border:4px solid var(--ink); border-radius:999px; box-shadow:0 5px 0 var(--ink);
  }
  #status b { white-space:nowrap; }

  /* Score card. Pops up over the top of the graph after Check (button, Enter or ✌️), then after ~4 s
     moves into the side panel under the equation, out of the way. Clear / Next / Previous remove it. */
  #result {
    position:relative; display:flex; align-items:center; gap:12px; padding:12px 48px 12px 14px;
    background:var(--card); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink);
    font-size:1.05rem; font-weight:800; animation:slideIn .4s ease-out;
  }
  #result.popup {
    position:absolute; z-index:3; top:14px; left:50%; transform:translateX(-50%); width:min(88%, 640px);
    gap:14px; padding:14px 52px 14px 18px; box-shadow:0 8px 0 var(--ink); font-size:1.2rem;
    animation:pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform:translateX(-50%) scale(.6); opacity:0; } to { transform:translateX(-50%) scale(1); opacity:1; } }
  @keyframes slideIn { from { transform:translateX(-40px); opacity:0; } to { transform:none; opacity:1; } }
  #result .close {
    position:absolute; top:8px; right:8px; width:36px; height:36px; padding:0; border-radius:50%;
    font-size:1.1rem; border-width:3px; box-shadow:0 3px 0 var(--ink); background:var(--card); color:var(--ink);
  }
  #result:empty { display:none; }
  #result::before { content:"🦉"; font-size:2rem; }
  #result.popup::before { font-size:2.6rem; }
  #result .score { flex:none; font-family:"Fredoka", sans-serif; font-size:1.6rem; background:var(--yellow); color:#1f2a44; border-radius:16px; padding:6px 12px; text-align:center; line-height:1.1; }
  #result.popup .score { font-size:2rem; padding:6px 14px; }
  #result .score small { display:block; font-size:1rem; }

  #status {
    text-align:left; padding:10px 14px; font-size:.95rem; line-height:1.45;
    background:#fff7b0; color:#1f2a44; border-radius:6px; transform:rotate(-1deg); box-shadow:0 4px 10px var(--shadow);
  }
  body.contrast { background:#000; }
  body.contrast #status { background:#222; color:#fff; }

  .settings { display:grid; grid-template-columns:1fr; gap:8px; }
  .settings > * { width:100%; min-width:0; }
  .settings label { display:flex; align-items:center; }
  .settings label, .settings select {
    font-size:1rem; font-weight:800; background:var(--card); color:var(--ink);
    border:3px solid var(--ink); border-radius:999px; padding:8px 14px; cursor:pointer;
  }
  .settings input { accent-color:var(--purple); transform:scale(1.2); margin-right:6px; }

  /* Narrower windows: smaller title and buttons; then the panel moves under the graph. */
  @media (max-width:1200px) {
    .brand { font-size:1.4rem; }
    .actions { gap:10px; } .actions button { font-size:1.15rem; padding:10px 18px; }
  }
  @media (max-width:960px) {
    :root { --head:auto; }
    .top { grid-template-columns:1fr auto; grid-template-areas:"brand dots" "buttons buttons"; padding:12px 16px; gap:10px; }
    .brand { grid-area:brand; } #dots { grid-area:dots; } .actions { grid-area:buttons; flex-wrap:wrap; }
    main.app { flex-direction:column; align-items:center; height:auto; }
    #stage { width:100%; height:auto; min-height:0; }
    .panel { width:100%; max-width:640px; max-height:none; overflow:visible; }
  }
  @media (max-width:600px) {
    #eq { font-size:1.8rem; }
    .actions button { font-size:1rem; padding:8px 12px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span>✏️</span> <span>Function</span> Tracer</div>
  <nav class="actions" aria-label="Game controls">
    <button id="prev" disabled>⬅ Previous</button>
    <button id="clear">🧽 Clear</button>
    <button id="check">✅ Check</button>
    <button id="next">Next ➜</button>
  </nav>
  <div id="dots" aria-label="Level progress"></div>
</header>
<main class="app">
  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="board" width="800" height="600"></canvas>
    <div id="result" aria-live="polite"></div>
    <div class="zoom">
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <span id="zoomLabel">Normal</span>
      <button id="zoomIn" aria-label="Zoom in">+</button>
    </div>
  </div>
  <aside class="panel">
  <section class="eq-card">
    <span class="eq-label">Trace this!</span>
    <div id="eq">Loading…</div>
  </section>
  <div id="resultDock"></div>
  <div class="settings">
    <select id="kind" aria-label="Kind of equations">
      <option value="mix">📈 Lines + curves</option>
      <option value="line">📏 Lines only</option>
      <option value="curve">🌈 Curves only</option>
    </select>
    <select id="tolerance" aria-label="Difficulty">
      <option value="1.5">🐢 Forgiving</option>
      <option value="0.75">🐇 Normal</option>
      <option value="0.4">🚀 Challenge</option>
    </select>
    <label><input type="checkbox" id="celebrate" checked>🎉 Confetti</label>
    <label><input type="checkbox" id="contrast">High contrast</label>
  </div>
  <div id="status">
    <b>👍 Your thumb is the pen:</b> touch your pointer finger to it on the graph to draw, keep them close to keep drawing, open them to stop ·
    <b>👌 Quick pinch</b> on a button to click ·
    <b>✌️ Peace sign</b> to check ·
    <b>✊ Fist</b> (thumb tucked in) for 1 second to clear
  </div>
  </aside>
</main>
<div id="handPointer"></div>
<div id="toast" role="status"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const ctx = $("board").getContext("2d");
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();

// ---------- View & zoom ----------
// The canvas is always 800×600 pixels; zoom (the − / + buttons or keys) changes how many graph units fit on it.
// The drawing is saved in graph units, so it stays in the right place when you zoom.
const W = 800, H = 600;
const ZOOMS = [
  { name: "Close",  half: 3.5, step: 1 },   // shows −3.5 … 3.5
  { name: "Normal", half: 5,   step: 1 },   // shows −5 … 5
  { name: "Far",    half: 8,   step: 2 },   // shows −8 … 8, numbers every 2
];
let zoomIdx = 1, XMIN, XMAX, YMIN, YMAX, STEP;
function setZoom(i) {
  zoomIdx = Math.max(0, Math.min(ZOOMS.length - 1, i));
  const z = ZOOMS[zoomIdx];
  XMIN = YMIN = -z.half; XMAX = YMAX = z.half; STEP = z.step;
  $("zoomLabel").textContent = z.name;
  $("zoomIn").disabled = zoomIdx === 0;
  $("zoomOut").disabled = zoomIdx === ZOOMS.length - 1;
}
const toPx = (x, y) => [(x - XMIN) / (XMAX - XMIN) * W, H - (y - YMIN) / (YMAX - YMIN) * H];
const toGraph = (px, py) => [XMIN + px / W * (XMAX - XMIN), YMIN + (H - py) / H * (YMAX - YMIN)];

// ---------- Random equations ----------
// Every equation is a list of pieces, so piecewise functions can be added later.
// Values are kept small so the whole graph is visible even at "Close" zoom.
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const coefText = m => ({ "1": "", "-1": "−", "0.5": "½", "-0.5": "−½" }[String(m)] ?? `${m < 0 ? "−" : ""}${Math.abs(m)}`);
const plusConst = b => (b === 0 ? "" : ` ${b < 0 ? "−" : "+"} ${Math.abs(b)}`);

function makeLine() {                                       // y = mx + b
  const m = pick([-3, -2, -1, -0.5, 0.5, 1, 2, 3]), b = randInt(-3, 3);
  return { label: `y = ${coefText(m)}x${plusConst(b)}`, snap: "line",
           pieces: [{ f: x => m * x + b, xmin: -10, xmax: 10 }] };
}
function makeFlat() {                                       // y = c
  const c = pick([-3, -2, -1, 1, 2, 3]);
  return { label: `y = ${c < 0 ? "−" : ""}${Math.abs(c)}`, snap: "line",
           pieces: [{ f: () => c, xmin: -10, xmax: 10 }] };
}
function makeCurve() {                                      // y = ±(x − h)² + k
  const a = pick([1, -1]), h = pick([-2, -1, 0, 0, 1, 2]);
  const k = a > 0 ? randInt(-3, 1) : randInt(-1, 3);        // keep the turning point on screen
  const inner = h === 0 ? "x²" : `(x ${h > 0 ? "−" : "+"} ${Math.abs(h)})²`;
  return { label: `y = ${a < 0 ? "−" : ""}${inner}${plusConst(k)}`, snap: "curve",
           pieces: [{ f: x => a * (x - h) ** 2 + k, xmin: -10, xmax: 10 }] };
}
function randomEquation(kind) {
  if (kind === "line") return Math.random() < 0.8 ? makeLine() : makeFlat();
  if (kind === "curve") return makeCurve();
  const r = Math.random();                                  // mix: 55% lines, 15% flat, 30% curves
  return r < 0.55 ? makeLine() : r < 0.7 ? makeFlat() : makeCurve();
}

// ---------- State ----------
let level = null;          // the current equation
let trace = [];            // A -> B contract: [{x, y, drawing}]
let cursor = null;         // smoothed cursor in pixels
let pinching = false, spaceHeld = false, revealed = false;
let wasDrawing = false;    // was the pen down on the previous frame?
let strokeStart = -1;      // index in `trace` where the current stroke began
let fistSince = 0, fistUsed = false;   // for "hold a fist to clear"
let peaceSince = 0, peaceSeenAt = 0, peaceUsed = false;   // for "hold a peace sign to check"
let clearLocked = false;   // after a peace-sign check, a fist can't clear until the hand has opened (or pinched)
let lockToldAt = 0;        // when we last said "open your hand first"
let pinchEndedAt = -Infinity;          // when the last pinch was released
let feedbackId = 0;
const ROUND = 5;           // progress dots: equations checked in this round of 5
let doneInRound = 0;

// ---------- Snapping (clean up a stroke when the pen lifts) ----------
// Nobody's hand is steady in the air, so when the pen lifts we work out what the student MEANT:
//   1. Steady the stroke: even out the spacing and blur away the shake (keeps the overall shape).
//   2. Recognise it from the student's OWN points: a straight line (any angle, even vertical),
//      a curve (a parabola y = a + bx + cx²), two straight lines meeting at a corner (a V, or two
//      strokes that were joined), or a free shape. Whichever fits the points best wins, with the
//      simplest shape preferred. A tiny bend at the very start or end is a "hook" from the fingers
//      pinching or letting go, and is dropped. It never looks at the correct answer or the
//      equation type, so a wrong shape stays wrong — it just looks neater.
//   3. "Snap to clean shape" ON → replace the stroke with that clean line/curve.
//      OFF → keep the steadied stroke, pulled partway toward the shape it looks like.
const SHAPE = {
  spacing: 0.04,      // resample the stroke every 0.04 graph units
  blur: 0.15,         // blur away shake smaller than about this many graph units
  lineFit: 0.04,      // a line is "good" if the stroke wanders from it by < 4% of the stroke's size…
  lineFloor: 0.1,     // …or by less than 0.1 graph units (short strokes)
  curveBetter: 0.6,   // a curve must fit at least 40% better than a line…
  curveFit: 0.06,     // …and the stroke wanders from that curve by < 6% of its size…
  bend: 0.065,        // …and bulge away from a straight chord by > 6.5% of its size (arms swinging in an
                      //    arc make straight lines bow by up to ~5%, and those should stay lines)
  bendIfNotLine: 0.05,// if it clearly isn't a line, a 5% bulge is enough
  bendIfLopsided: 0.04,// and if the bulge sits toward one end (one side of a U, bent at the bottom),
                      //    4% is enough — an arm swinging in an arc bulges in the middle instead
  lopsided: 0.1,      // "toward one end" = the bulge's centre is > 10% of the length off the middle
  bendFloor: 0.2,     // and any curve must bulge by at least 0.2 graph units (bigger than hand shake)
  pullOff: 0.6,       // snap OFF: move the steadied stroke 60% of the way toward the recognised shape
  assistLine: 0.07,   // a messy stroke within 7% (of its size) of a straight line still becomes one…
  assistCurve: 0.08,  // …or within 8% of a curve (the game only uses lines and parabolas)
  cornerAngle: 30,    // two lines meeting at a corner must differ in direction by more than 30°…
  cornerBetter: 0.6,  // …and fit at least 40% better than the best single line/curve
  hookLen: 0.45,      // a corner piece shorter than this (graph units) at the start/end is a hook: dropped
  cornerVsCurve: 1.7, // a corner must also fit 1.7× better than any curve (else a smooth bend = a curve)
};
// Lean toward the kind of graph being traced (only its TYPE — line or parabola — never the answer
// itself). On a parabola, a bend counts as a curve much more easily and a V-ish U becomes a U; on a line,
// a slight bow stays straight more easily. A clearly wrong shape still stays wrong.
const LEAN = {
  curve: { lineFit: 0.03, curveBetter: 0.8, curveFit: 0.09, bend: 0.03, bendIfLopsided: 0.02, bendIfNotLine: 0.025,
           bendFloor: 0.22, cornerBetter: 0.45, cornerVsCurve: 3, assistCurve: 0.12, assistLine: 0.05, noCorner: true },
  line:  { bend: 0.09, bendIfLopsided: 0.06, bendIfNotLine: 0.06, curveBetter: 0.5, bendFloor: 0.25,
           assistLine: 0.09, assistCurve: 0.06 },
};
const shapeRulesFor = kind => ({ ...SHAPE, ...(LEAN[kind] || {}) });
let SH = SHAPE;            // the rules in use for the stroke being recognised
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const rms = a => Math.sqrt(mean(a.map(v => v * v)));

// Evenly spaced points along the stroke (removes repeats and speed differences).
function resample(pts, spacing) {
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    let a = pts[i - 1]; const b = pts[i], seg = Math.hypot(b.x - a.x, b.y - a.y);
    if (seg === 0) continue;
    let t = spacing - carry;
    while (t <= seg) { out.push({ x: a.x + (b.x - a.x) * t / seg, y: a.y + (b.y - a.y) * t / seg }); t += spacing; }
    carry = seg - (t - spacing);
  }
  const last = pts[pts.length - 1];
  if (Math.hypot(last.x - out.at(-1).x, last.y - out.at(-1).y) > spacing * 0.3) out.push({ x: last.x, y: last.y });
  return out;
}
// Gaussian blur along the stroke. The ends are held in place so the stroke doesn't shrink.
function blur(pts, sigmaPts) {
  if (sigmaPts < 0.5 || pts.length < 3) return pts.map(p => ({ ...p }));
  const r = Math.ceil(sigmaPts * 2.5), w = [];
  for (let k = -r; k <= r; k++) w.push(Math.exp(-(k * k) / (2 * sigmaPts * sigmaPts)));
  return pts.map((p, i) => {
    const reach = Math.min(r, i, pts.length - 1 - i);       // shrink the window near the ends
    let sx = 0, sy = 0, sw = 0;
    for (let k = -reach; k <= reach; k++) { const q = pts[i + k], wk = w[k + r]; sx += wk * q.x; sy += wk * q.y; sw += wk; }
    return { x: sx / sw, y: sy / sw };
  });
}
// Best straight line through the points, measuring distance at right angles (works for steep lines too).
function fitLine(pts) {
  const cx = mean(pts.map(p => p.x)), cy = mean(pts.map(p => p.y));
  let sxx = 0, syy = 0, sxy = 0;
  for (const p of pts) { const dx = p.x - cx, dy = p.y - cy; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  const ang = 0.5 * Math.atan2(2 * sxy, sxx - syy), ux = Math.cos(ang), uy = Math.sin(ang);
  const along = p => (p.x - cx) * ux + (p.y - cy) * uy;
  const project = p => { const t = along(p); return { x: cx + t * ux, y: cy + t * uy }; };
  const err = rms(pts.map(p => (p.x - cx) * -uy + (p.y - cy) * ux));
  return { err, project, along, at: t => ({ x: cx + t * ux, y: cy + t * uy }) };
}
// Best parabola y = a + bx + cx², if the stroke moves steadily left→right (or right→left).
function fitCurve(pts) {
  const xs = pts.map(p => p.x), lo = Math.min(...xs), hi = Math.max(...xs), span = hi - lo;

    const timer = setTimeout(() => ctrl.abort(), 8000);
    const resp = await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ equation: level.label, overall: r.overall, pieces: r.pieces }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const { text } = await resp.json();
    show(text || fallback);
  } catch (err) {
    console.warn("Claude feedback unavailable, using backup message:", err.message);
    show(fallback);
  }
}

// ---------- Drawing ----------
function drawGrid() {
  ctx.clearRect(0, 0, W, H);                                  // wipe the last frame completely
  ctx.fillStyle = css("--bg"); ctx.globalAlpha = 0.6; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; // webcam shows faintly through
  ctx.lineWidth = 1; ctx.strokeStyle = css("--grid");
  for (let v = Math.ceil(XMIN); v <= XMAX; v++) {             // a grid line every 1 unit
    const [px] = toPx(v, 0); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
    const [, py] = toPx(0, v); ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
  }
  ctx.lineWidth = 3; ctx.strokeStyle = css("--axis");
  const [ox, oy] = toPx(0, 0);
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();
  drawAxisNumbers(ox, oy);
}
// Numbers along each axis (every STEP units), plus "x" and "y" names.
// Each label gets an outline in the background color so it stays readable over grid lines.
function drawAxisNumbers(ox, oy) {
  const fmt = v => (v < 0 ? "−" + -v : String(v));          // real minus sign reads better than "-"
  ctx.font = "bold 18px Nunito, system-ui, sans-serif";
  ctx.lineWidth = 5; ctx.lineJoin = "round";
  ctx.strokeStyle = css("--bg"); ctx.fillStyle = css("--ink");
  const label = (text, x, y, align, baseline) => {
    ctx.textAlign = align; ctx.textBaseline = baseline;
    ctx.strokeText(text, x, y); ctx.fillText(text, x, y);
  };
  for (let v = Math.ceil(XMIN / STEP) * STEP; v < XMAX; v += STEP) {
    if (v === 0 || Math.abs(v) > XMAX - 0.25) continue;      // skip 0 and labels at the very edge
    const [px] = toPx(v, 0);
    label(fmt(v), px, oy + 6, "center", "top");             // under the x-axis
    const [, py] = toPx(0, v);
    label(fmt(v), ox - 8, py, "right", "middle");           // left of the y-axis
  }
  label("0", ox - 8, oy + 6, "right", "top");
  ctx.font = "italic bold 22px Fredoka, system-ui, sans-serif";
  label("x", W - 10, oy - 8, "right", "bottom");
  label("y", ox + 10, 8, "left", "top");
}
function drawAnswer() {
  ctx.lineWidth = 5; ctx.strokeStyle = css("--answer"); ctx.setLineDash([12, 8]);
  for (const pc of level.pieces) {
    ctx.beginPath(); let started = false;
    const lo = Math.max(pc.xmin, XMIN), hi = Math.min(pc.xmax, XMAX);
    for (let i = 0; i <= 400; i++) {
      const x = lo + (hi - lo) * i / 400, y = pc.f(x);
      if (y < YMIN - 1 || y > YMAX + 1) { started = false; continue; }
      const [px, py] = toPx(x, y);
      started ? ctx.lineTo(px, py) : ctx.moveTo(px, py); started = true;
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function drawTrace() {
  ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = css("--trace");
  ctx.beginPath();
  for (let i = 0; i < trace.length; i++) {
    const p = trace[i]; if (!p.drawing) continue;
    const [px, py] = toPx(p.x, p.y);
    (i > 0 && trace[i - 1].drawing) ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}
function drawCursor(drawing) {
  if (!cursor) return;
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, drawing ? 14 : 18, 0, Math.PI * 2);
  ctx.lineWidth = 4; ctx.strokeStyle = css("--cursor"); ctx.fillStyle = css("--cursor");
  drawing ? ctx.fill() : ctx.stroke();
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 3.5, 0, Math.PI * 2);   // center dot: exactly where the pen is
  ctx.fillStyle = css("--ink"); ctx.fill();
  if (mode === "fist" && !fistUsed) {                         // ring fills up while holding a fist
    const t = fistProgress(performance.now());
    ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 28, -Math.PI / 2, -Math.PI / 2 + t * 2 * Math.PI);
    ctx.lineWidth = 6; ctx.strokeStyle = css("--cursor"); ctx.stroke();
  }
  if (mode === "peace" && !peaceUsed) {                       // green ring + ✌️ while holding a peace sign
    const t = peaceProgress(performance.now());
    ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 30, -Math.PI / 2, -Math.PI / 2 + t * 2 * Math.PI);
    ctx.lineWidth = 8; ctx.strokeStyle = css("--green"); ctx.stroke();
    ctx.font = "28px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("✌️", cursor.x, cursor.y - 48);
  }
}
function drawTakeover() {                                     // ring fills while a new hand waits to take control
  if (!challenger?.lm) return;
  const c = canvasPointFor(challenger.lm[4]);
  if (!c) return;                                             // only drawn when that hand is over the graph
  const t = Math.min(1, (performance.now() - challenger.since) / challenger.wait);
  ctx.beginPath(); ctx.arc(c.x, c.y, 22, 0, Math.PI * 2);
  ctx.lineWidth = 3; ctx.strokeStyle = css("--axis"); ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(c.x, c.y, 22, -Math.PI / 2, -Math.PI / 2 + t * 2 * Math.PI);
  ctx.lineWidth = 6; ctx.strokeStyle = css("--cursor"); ctx.stroke();
}
function render(drawing = false) {
  drawGrid(); if (revealed) drawAnswer(); drawTrace(); drawCursor(drawing); drawTakeover();
}

// ---------- Hand tracking (Person A) ----------
// The MAIN hand's thumb tip is a pointer for the whole page (the thumb stays still while the
// pointer finger comes down to pinch, so lines are steadier):
//   pinch & hold on the graph = draw · quick pinch on a button = click ·
//   fist for 1 second = clear
// The closest hand to the camera becomes the main hand; background people are ignored. Another hand
// takes over after 2 s once the main hand is gone, or after 1 s if it is clearly closer (a ring fills
// while it waits). If the main hand is gone for 1.5 s, the game forgets it and picks the closest hand.
//
// Tuning knobs (test these on a real webcam and adjust):
const HAND = {
  edge: 0.12,               // ignore this much of each camera edge, so you can reach every corner of the page
  // The pen (thumb–index gap ÷ hand size, measured in 3D; touching ≈ 0.16, 2 cm apart ≈ 0.28,
  // 4 cm ≈ 0.44, 6 cm ≈ 0.64):
  pinchOn: 0.3,                   // START drawing: fingers touching (or very nearly) — nothing starts by itself
  pinchOff: 0.5,                  // KEEP drawing while the fingers stay close (up to ~5 cm apart); open wider to stop
  clickOff: 0.4,                  // a pinch on a button lets go sooner (~4 cm), so clicks feel quick
  releaseMs: 120,                 // fingers must stay open this long to lift the pen (fast moves blur the
                                  //   camera image, so a pinch can look open for a frame or two)
  lostGraceMs: 400,               // if the camera loses your hand for less than this, carry on as if it hadn't…
  lostGraceDrawingMs: 2500,       // …or this long while you're drawing: the line waits for your hand to come back.
                                  // When it does: fingers still close → the SAME line carries on;
                                  // fingers open → the line ends where it was (no stray connecting line).
  gapMs: 150,                     // a pause in tracking longer than this counts as "the hand came back"
  tapMs: 600, tapMovePx: 50,      // a "click" = pinch released within 600 ms, moving less than 50 px
  fistMs: 1000,                   // hold a fist this long to clear (after it's confirmed)
  fistConfirmMs: 300,             // a fist must be seen this long before it counts (filters quick blips)
  fistAfterPinchMs: 600,          // no fist for this long after a pinch ends (hands curl as they relax)
  fistCurl: 1.1,                  // fingertip must be within this × the knuckle's distance from the wrist
  // ✊ Fist (clear) also needs the thumb tucked in or along the side, with its tip below the top of
  // the fist. Resting with your thumb up as the pen (fingers closed) is NOT a fist, so pausing between
  // strokes can't clear. (Thumb tip's distance from the middle of the knuckles ÷ knuckle width:
  // real fists ≈ 0.6–1.06 on a 3D hand model; a thumb held up as the pen ≈ 1–1.8.)
  thumbTucked: 1.2,
  // ✌️ Peace sign (check): pointer + middle finger straight and spread in a V, ring + pinky curled.
  // Nothing you do while drawing or clicking looks like this.
  peaceStraight: 0.8,             // a finger is "straight" if tip-to-knuckle ≥ 80% of its length along the joints
  peaceReach: 1.35,               // …and its tip is ≥ 1.35× as far from the wrist as its knuckle
  peaceDown: 1.3,                 // ring + pinky count as down if their tips are within 1.3× their knuckles' distance
  peaceSpread: 1.3,               // the V: fingertips at least 1.3× as far apart as the two knuckles
  peaceMs: 600,                   // hold a peace sign this long to check (a ring fills up)
  gestureGapMs: 150,              // a gesture can drop out for this long (a blurry frame) without restarting

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const extended = (lm, tip, joint) => dist(lm[tip], lm[0]) > dist(lm[joint], lm[0]);
// "Curled" = fingertip pulled right down to its knuckle (about as close to the wrist as the knuckle).
// The pointer finger tells a pinch from a fist: in a pinch it reaches out to the thumb, in a fist
// it's curled. So a curled pointer finger is never a pinch, and a fist needs all four curled.
// Hand measurements are taken in 3D (camera pixels, with MediaPipe's depth estimate), so tilting the
// hand toward or away from the camera doesn't change them. Flat 2D distances shrink when the hand
// tilts, which made a closed pinch look like a curled finger and lifted the pen mid-line.
let camAspect = 4 / 3;     // camera picture width ÷ height (measurements use true proportions)
const px3 = p => ({ x: p.x * 640, y: p.y * 640 / camAspect, z: (p.z ?? 0) * 640 });

// is bigger. Bigger = closer to the camera.
const handSize = lm => Math.max(dist3(lm[0], lm[9]), 1.6 * dist3(lm[5], lm[17]));
const curled = (lm, tip, knuckle) => dist3(lm[tip], lm[0]) < HAND.fistCurl * dist3(lm[knuckle], lm[0]);
const isFist = lm => [[8, 5], [12, 9], [16, 13], [20, 17]].every(([tip, knuckle]) => curled(lm, tip, knuckle));
const pinchRatio = lm => dist3(lm[4], lm[8]) / handSize(lm);   // thumb–index gap relative to hand size
// How far the thumb tip sticks out from the middle of the knuckles (÷ knuckle width).
function thumbReach(lm) {
  const k = [5, 9, 13, 17].map(i => px3(lm[i])), t = px3(lm[4]);
  const c = { x: mean(k.map(p => p.x)), y: mean(k.map(p => p.y)), z: mean(k.map(p => p.z)) };
  return Math.hypot(t.x - c.x, t.y - c.y, t.z - c.z) / dist3(lm[5], lm[17]);
}
const fourCurled = lm => [[8, 5], [12, 9], [16, 13], [20, 17]].every(([tip, knuckle]) => curled(lm, tip, knuckle));
// Is the thumb tip on top of the hand (higher than every other part, in the picture)? A thumb held up
// as the pen is; in a real fist it's tucked across or along the fingers, below the top.
function thumbOnTop(lm) {
  const highestOther = Math.min(...[0, 5, 6, 7, 8, 9, 10, 12, 13, 16, 17, 20].map(i => px3(lm[i]).y));
  return (highestOther - px3(lm[4]).y) / handSize(lm) > -0.05;
}
// ✊ Fist (clear) = four fingers curled AND the thumb tucked in (not held up like the pen).
const isClearFist = lm => fourCurled(lm) && thumbReach(lm) < HAND.thumbTucked && !thumbOnTop(lm);
// ✌️ Peace sign (check): pointer + middle straight and out, spread in a V; ring + pinky down.
function fingerOut(lm, k, j1, j2, tip) {
  const along = dist3(lm[k], lm[j1]) + dist3(lm[j1], lm[j2]) + dist3(lm[j2], lm[tip]);
  return dist3(lm[k], lm[tip]) >= HAND.peaceStraight * along && dist3(lm[tip], lm[0]) >= HAND.peaceReach * dist3(lm[k], lm[0]);
}
const fingerDown = (lm, tip, k) => dist3(lm[tip], lm[0]) < HAND.peaceDown * dist3(lm[k], lm[0]);
function isPeace(lm) {

    && fingerDown(lm, 16, 13) && fingerDown(lm, 20, 17)
    && dist3(lm[8], lm[12]) >= HAND.peaceSpread * dist3(lm[5], lm[9]);

// An open-ish hand (3+ fingers out) — used to unlock fist-clear after a check.
const handOpen = lm => [[8, 5], [12, 9], [16, 13], [20, 17]].filter(([t, k]) => dist3(lm[t], lm[0]) > 1.3 * dist3(lm[k], lm[0])).length >= 3;

// ----- Main hand: who controls the pen -----
// MediaPipe doesn't say which hand is which from frame to frame, so we follow the main hand
// by where it was last seen, its size, and whether it is a left or right hand.
// "The person in front wins": a hand's size on camera tells us how close it is. Hands that are
// much smaller than the closest hand (people in the background) are ignored completely.
const HANDS = {
  takeoverMs: 2000,   // a new hand must wait this long to take control while the main hand is gone…
  closerMs: 1000,     // …or this long if it is clearly closer to the camera than the main hand
  lostMs: 1000,       // the main hand can vanish this long (tracking blink) and still be recognized
  forgetMs: 1500,     // after this long without the main hand, forget it and pick the closest hand fresh
  rememberMs: 6000,   // for this long after the main hand leaves, much smaller hands still count as background
  matchDist: 0.35,    // how far (fraction of the screen) the main hand can move between sightings
  sameSize: 1.6,      // a hand more than 1.6× bigger/smaller than the main hand is not the same hand
  closer: 1.35,       // a hand 1.35× bigger than the main hand counts as "clearly closer"
  background: 0.5,    // hands smaller than half the closest hand are background people: ignored
  minSize: 30,        // hands smaller than this (camera pixels) are too far away to use at all
};

let challenger = null;     // { pos, since, lm } a hand waiting to take control (drives the takeover ring)

let lastMain = null;       // { size, seen } of the most recent main hand, so a background hand can't

// Keep only hands of the person in front, closest first.
function frontHands(hands, now) {
  const sized = hands.map(h => ({ ...h, size: handSize(h.lm) })).filter(h => h.size >= HANDS.minSize);
  const remembered = lastMain && now - lastMain.seen < HANDS.rememberMs ? lastMain.size : 0;
  const biggest = Math.max(remembered, ...sized.map(h => h.size));
  return sized.filter(h => h.size >= biggest * HANDS.background).sort((a, b) => b.size - a.size);
}

function pickMainHand(hands, now) {          // hands: front hands, closest first → the main hand, or null
  const follow = h => {
    main = { pos: h.lm[9], side: h.side, size: h.size, seen: now };
    lastMain = { size: h.size, seen: now };

    cursor = null; pointer = null; pinching = false; pinchStart = null; fistSince = 0; challenger = null;
    return follow(h);

  // size blur or a tilt makes it look, and without resetting the pen (so a line can carry on after the
  // camera lost the hand). Waiting / resetting here is what stopped lines resuming after a dropout.
  if (hands.length === 1) { challenger = null; return main ? follow(hands[0]) : take(hands[0]); }
  // Main hand gone a while: recalibrate — but never in the middle of a line (the line is waiting for the
  // hand to come back; forgetting it here reset the pen and broke the line).
  if (main && now - main.seen > HANDS.forgetMs && !penIsDown()) main = null;
  if (!hands.length) { challenger = null; return null; }
  if (!main) return take(hands[0]);                           // nobody in control: the closest hand, no waiting

  let matched = null, bestCost = Infinity;                    // find the main hand again
  if (now - main.seen <= HANDS.lostMs) {
    for (const h of hands) {
      const ratio = Math.max(h.size, main.size) / Math.min(h.size, main.size);
      if (ratio > HANDS.sameSize) continue;                   // too different in size to be the same hand
      const cost = dist(h.lm[9], main.pos) + (h.side !== main.side ? 0.3 : 0);
      if (cost < bestCost) { matched = h; bestCost = cost; }

    // a quick turn made it look a different size this frame.

  // While it's gone, the closest other hand (even if other hands are on screen too).
  const others = hands.filter(h => h !== matched);

  if (!rival) { challenger = null; return matched ? follow(matched) : null; }
  if (!challenger || dist(rival.lm[9], challenger.pos) > HANDS.matchDist) {
    challenger = { since: now };                              // a new hand started waiting
    toast(matched ? "✋ Closer hand: hold still to take over" : "✋ New hand: hold still to take over");
  }
  challenger.pos = rival.lm[9]; challenger.lm = rival.lm;
  challenger.wait = matched ? HANDS.closerMs : HANDS.takeoverMs;

let landmarker, lastVideoTime = -1;
let pointer = null;              // smoothed pointer position on the page (viewport pixels)
let mode = "none";               // "point" | "fist" | "peace" | "none"
let pinchStart = null;           // where/when the current pinch began: {t, x, y, onCanvas}
let hoverEl = null;

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = "none"), 1200);
}

// Camera point → page position (mirrored, like a mirror), and → graph position if it's over the graph.
// With clamp = false the point can go past the screen edge (used for movement, so the whole camera
// picture counts, including the edge strips).
function viewportPointFor(p, clamp = true) {
  const map = (v, size) => { const s = (v - HAND.edge) / (1 - 2 * HAND.edge) * size;
    return clamp ? Math.min(size, Math.max(0, s)) : s; };
  return { x: map(1 - p.x, innerWidth), y: map(p.y, innerHeight) };
}
function canvasPointFor(p) {
  const v = viewportPointFor(p), r = $("board").getBoundingClientRect();
  if (document.elementFromPoint(v.x, v.y) !== $("board")) return null;
  return { x: (v.x - r.left) / r.width * W, y: (v.y - r.top) / r.height * H };

// ----- Steady pen -----
// 1. A "One Euro" filter steadies the hand: lots of smoothing when you move slowly (that's when
//    shake shows), little when you move fast (so the pointer doesn't lag behind big moves).
// 2. While the pen is down, how far the pen moves depends on how FAST your hand moves (like a mouse):
//    slow, careful movement (and shake) is scaled down the most, so it stays tiny; a quicker sweep is
//    scaled down less, so long lines don't take forever. "Pen speed" sets both amounts.
//    After you lift the pen it stays where you stopped while your hand holds still (pinch again to
//    carry on the line); as soon as your hand moves, it catches up with your hand, so you can still
//    reach every button.

  pointFilter: { minCutoff: 1.5, beta: 0.006 },   // pointing at buttons: responsive
  drawFilter:  { minCutoff: 1.0, beta: 0.006 },   // drawing: a bit steadier (lower = smoother, more lag)
  slowSpeed: 0.03,        // hand speeds (screen widths per second) at or below this use the slow pen…
  fastSpeed: 0.18,        // …at or above this (a relaxed sweep) use the fast gain; in between it blends
  settleMs: 300,          // just after lifting, keep the drawing speed while the filter settles (no jump)
  catchUpPx: 200,         // pen up: every 200 px your hand moves shrinks the pointer–hand gap to ~37%
  returnMs: 250,          // off the graph it also catches up over time (~this long)
  leaveDist: 60,          // …and once your hand is this many pixels from where you lifted the pen
  jumpFrac: 0.05,         // a one-frame jump bigger than 5% of the screen width (drawing moves < 2%/frame) is a
                          //   tracking glitch, not your hand: ignore it (a real fast move is only delayed 1 frame)

  pushSide: 0.15, pushSideFull: 0.04,   // edge push starts 15% in from the left/right of the camera picture,
  pushTop: 0.22, pushTopFull: 0.1,      //   22% from the top/bottom (fingers / wrist leave the picture sooner there),

  filter(x, tSec, { minCutoff, beta }) {
    const alpha = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));

let penOffset = { x: 0, y: 0 };  // pointer − hand: grows while drawing slowly, shrinks to 0 after

  let raw = viewportPointFor(tip, false);
  if (!pointer) { steadyX.reset(); steadyY.reset(); handAt = null; penOffset = { x: 0, y: 0 }; handSpeed = 0; lastRaw = null; jumpTo = null; heading = { x: 0, y: 0 }; }
  // One-frame tracking glitch? A single frame far from both the frame before AND the frame after is
  // ignored: hold the last position for that one frame. If the next frame is also away from the old
  // position, the hand really moved (fast) and we follow it. A hand that just came back after the camera
  // lost it is never treated as a glitch.
  if (now - lastMoveT > HAND.gapMs) { lastRaw = null; jumpTo = null; }
  if (lastRaw && Math.hypot(raw.x - lastRaw.x, raw.y - lastRaw.y) > PEN.jumpFrac * innerWidth) {
    if (!jumpTo) { jumpTo = raw; raw = lastRaw; }               // first far frame: wait one frame to see
    else jumpTo = null;                                         // second far frame in a row: it's real
  } else jumpTo = null;
  lastRaw = raw;
  const down = penIsDown(), opts = down ? PEN.drawFilter : PEN.pointFilter;
  if (down) { penUpAt = 0; liftedAt = null; } else if (!penUpAt) penUpAt = now;
  const settling = !down && now - penUpAt < PEN.settleMs;    // the pen was lifted a moment ago
  const hand = { x: steadyX.filter(raw.x, now / 1000, opts), y: steadyY.filter(raw.y, now / 1000, opts) };
  if (handAt) {
    const dt = Math.max(0, now - lastMoveT);
    const dx = hand.x - handAt.x, dy = hand.y - handAt.y;
    if (dt > 0) handSpeed += 0.5 * (Math.hypot(dx, dy) / innerWidth / (dt / 1000) - handSpeed);
    // Fingers just touched, or coming apart: hold the pen still (k = −1 cancels the hand's movement).
    const pressing = down && pinching && pinchStart && now - pinchStart.t < PEN.pressMs;
    const releasing = down && pinching && openSince > 0;
    if (down || settling) {      // pen down: slow movement is scaled down, fast movement isn't
      const k = pressing || releasing ? -1 : penGain(handSpeed) - 1;
      penOffset.x += k * dx; penOffset.y += k * dy;
      // Out of room? The slower pen needs more hand movement than the camera can see. As your thumb gets
      // near the edge of the picture while you're moving TOWARD that edge, the pen keeps going that way
      // (closer to the edge = faster). It starts well inside the picture, where the camera still sees
      // your whole hand, and it only pushes the way you were already going, so a flat line drawn near
      // the top doesn't creep upward.
      if (down && !pressing && !releasing) {
        if (Math.hypot(dx, dy) > 0.5) {                        // which way is the hand going? (kept while it holds still)
          const L = Math.hypot(dx, dy), a = Math.min(1, dt / 250);
          heading.x += a * (dx / L - heading.x); heading.y += a * (dy / L - heading.y);
        }
        const ramp = (v, inner, outer) => Math.min(1, Math.max(0, (v - inner) / (outer - inner)));
        const right = ramp(1 - tip.x, 1 - PEN.pushSide, 1 - PEN.pushSideFull), left = ramp(tip.x, 1 - PEN.pushSide, 1 - PEN.pushSideFull);
        const down_ = ramp(tip.y, 1 - PEN.pushTop, 1 - PEN.pushTopFull), up = ramp(1 - tip.y, 1 - PEN.pushTop, 1 - PEN.pushTopFull);
        const step = PEN.pushSpeed * dt / 1000;               // (camera is mirrored left↔right)
        // Only when CLEARLY heading toward the edge (> 0.6 of the direction), fading in from there — the
        // small up/down jitter of a sideways line must not add up into a drift.
        const toward = h => Math.max(0, (h - 0.6) / 0.4);
        const px = step * (right * toward(heading.x) - left * toward(-heading.x));
        const py = step * (down_ * toward(heading.y) - up * toward(-heading.y));
        penOffset.x += px; penOffset.y += py;
        const r = $("board").getBoundingClientRect();
        pushed += Math.hypot(px / r.width * (XMAX - XMIN), py / r.height * (YMAX - YMIN));
      }
    } else {                     // pen up: catch up with the hand as it moves (holding still keeps the pen put)
      const moving = handSpeed > PEN.slowSpeed;               // real movement, not shake
      let decay = moving ? Math.exp(-Math.hypot(dx, dy) / PEN.catchUpPx) : 1;
      // Once your hand has moved away from where you lifted the pen (or the pointer is off the graph), you're
      // not carrying on the line: the pointer catches up with your hand over time, even if your hand has
      // stopped (e.g. on a button you're about to pinch).
      if (!liftedAt) liftedAt = { ...hand };
      const movedAway = Math.hypot(hand.x - liftedAt.x, hand.y - liftedAt.y) > PEN.leaveDist;
      if (!cursor || movedAway) decay *= Math.exp(-dt / PEN.returnMs);
      penOffset.x *= decay; penOffset.y *= decay;
    }
  }
  handAt = hand; lastMoveT = now;
  { const r = $("board").getBoundingClientRect();
    const [gx, gy] = toGraph((hand.x - r.left) / r.width * W, (hand.y - r.top) / r.height * H);
    handGraph = { x: gx, y: gy }; }
  // Keep the pointer on screen; while drawing, keep it on the graph, so the pen slides along the
  // border instead of leaving the graph and cutting the line.
  const r = $("board").getBoundingClientRect();
  const box = down ? { l: r.left + 1, t: r.top + 1, r: r.right - 1, b: r.bottom - 1 } : { l: 0, t: 0, r: innerWidth, b: innerHeight };
  pointer = { x: Math.min(box.r, Math.max(box.l, hand.x + penOffset.x)),
              y: Math.min(box.b, Math.max(box.t, hand.y + penOffset.y)) };
  penOffset = { x: pointer.x - hand.x, y: pointer.y - hand.y };   // don't build up an offset past the edge
  const onBoard = down || document.elementFromPoint(pointer.x, pointer.y) === $("board");   // (the zoom buttons
  cursor = onBoard                                                                         //  don't stop a line)
    ? { x: (pointer.x - r.left) / r.width * W, y: (pointer.y - r.top) / r.height * H }
    : null;                                                  // not over the graph (e.g. over a button)
}

// Click whatever is under a point: buttons, checkboxes (via their label), and dropdowns.
function clickableAt(x, y) {
  return document.elementFromPoint(x, y)?.closest("button, select, label") ?? null;
}
function clickAt(x, y) {
  const el = clickableAt(x, y);
  if (!el || el.disabled) return;
  if (el.tagName === "SELECT") {                              // a hand can't open a dropdown, so step to the next option
    el.selectedIndex = (el.selectedIndex + 1) % el.options.length;
    el.dispatchEvent(new Event("change"));
    toast(el.options[el.selectedIndex].textContent.trim());
  } else {
    el.click();
  }
}

// 0 → 1 as a confirmed fist is held; 1 = clear.
const fistProgress = now => Math.min(1, Math.max(0, (now - fistSince - HAND.fistConfirmMs) / HAND.fistMs));

const peaceProgress = now => Math.min(1, Math.max(0, (now - peaceSince) / HAND.peaceMs));

function oneHand(lm, now, gap = 0) {
  const ratio = pinchRatio(lm);
  // The hand just came back after the camera lost it: decide right away from what the fingers are doing
  // NOW (no waiting). Still close → the line carries on. Open → the line ends where it was, and the pen
  // does not draw a line across to where the hand is now.
  if (gap > HAND.gapMs && pinching && ratio >= HAND.pinchOff) {
    pinching = false; pinchEndedAt = now; pinchStart = null; openSince = 0;
  }
  movePointer(lm[4], now);                                    // thumb tip = pen and pointer
  // ✌️ Peace sign = check, held for peaceMs (a green ring fills). Never while drawing. Only frames that
  // really are a peace sign do anything here — every other frame goes on to the normal pinch/fist logic.
  if (!pinching && isPeace(lm)) {
    if (!peaceSince || now - peaceSeenAt > HAND.gestureGapMs) { peaceSince = now; peaceUsed = false; }
    peaceSeenAt = now; mode = "peace"; fistSince = 0;
    if (!peaceUsed && peaceProgress(now) >= 1) {
      peaceUsed = true;
      clearLocked = true;                                     // folding the fingers into a fist must not clear
      if (revealed) toast("Already checked: 🧽 Clear to retry, or Next ➜");
      else check();
    }
    return;
  }
  if (now - peaceSeenAt > HAND.gestureGapMs) peaceSince = 0;  // (a single blurry frame doesn't restart it)
  if (pinching || handOpen(lm)) clearLocked = false;          // the hand opened (or pinched): fist-clear allowed again
  if (clearLocked && isClearFist(lm)) {                       // tell them once why the fist isn't clearing
    if (!lockToldAt || now - lockToldAt > 4000) { toast("Open your hand first, then ✊ to clear"); lockToldAt = now; }
  }
  // ✊ Fist (thumb tucked in) = clear. A pinch always wins: no fist while pinching, or just after letting
  // go of one, and a fist has to be held steady for fistConfirmMs before it counts.
  if (!pinching && !clearLocked && now - pinchEndedAt > HAND.fistAfterPinchMs && isClearFist(lm)) {
    if (!fistSince) fistSince = now;
    if (now - fistSince >= HAND.fistConfirmMs) {
      mode = "fist"; pinchStart = null;
      if (!fistUsed && fistProgress(now) >= 1) { clearDrawing(); fistUsed = true; toast("Cleared 🧽"); }
      return;
    }
  } else { fistSince = 0; fistUsed = false; }
  mode = "point";
  const wasPinching = pinching;
  // Start: fingers touching, and it's not a fist (in a fist the thumb also rests near the pointer finger).
  // Stop: fingers opened past pinchOff (held releaseMs), or a real fist. Nothing else lifts the pen —
  // a tilted hand can make single fingers look curled, so that is never used here.
  const fist = isClearFist(lm);
  const open = ratio > (pinching && pinchStart && !pinchStart.onCanvas ? HAND.clickOff : HAND.pinchOff) || fist;
  if (!pinching && ratio < HAND.pinchOn && !fist) { pinching = true; openSince = 0; }
  else if (pinching && open) {                                // only lift the pen once the fingers STAY open
    if (!openSince) openSince = now;
    if (now - openSince >= HAND.releaseMs) pinching = false;
  } else openSince = 0;
  if (pinching && !wasPinching) pinchStart = { t: now, x: pointer.x, y: pointer.y, onCanvas: !!cursor };
  if (!pinching && wasPinching) pinchEndedAt = now;
  if (!pinching && wasPinching && pinchStart) {               // pinch released: was it a quick tap?
    const quick = now - pinchStart.t < HAND.tapMs && dist(pointer, pinchStart) < HAND.tapMovePx;
    if (quick && !pinchStart.onCanvas) clickAt(pinchStart.x, pinchStart.y);
    pinchStart = null;
  }
}

let openSince = 0;               // when the fingers opened during a pinch (0 = they're closed)
let handSeenAt = -Infinity;      // when the main hand was last seen
function noHands() {
  handGraph = null;
  mode = "none"; pointer = null; cursor = null; pinching = false; pinchStart = null; fistSince = 0; openSince = 0;
  peaceSince = 0;                  // (clearLocked stays on: only seeing the hand OPEN unlocks fist-clear)
}

// Show the page pointer (hidden over the graph, where the graph's own cursor shows) and highlight what it would click.
function updatePointerUI() {
  const el = $("handPointer");
  const show = pointer && !cursor;
  el.style.display = show ? "block" : "none";
  if (show) {
    el.style.transform = `translate(${pointer.x}px, ${pointer.y}px)`;
    el.className = pinching ? "pinch" : "";
    el.textContent = mode === "fist" ? "✊" : mode === "peace" ? "✌️" : "";
    el.style.background = mode === "peace" && !peaceUsed       // green ring fills while holding a peace sign
      ? `conic-gradient(var(--green) ${peaceProgress(performance.now()) * 360}deg, #ffffff99 0)` : "";
  }
  const target = show && mode === "point" ? clickableAt(pointer.x, pointer.y) : null;
  if (mode === "peace" && !peaceUsed && peaceProgress(performance.now()) < 0.05 && !revealed) toast("✌️ Hold it… checking");
  if (target !== hoverEl) {
    hoverEl?.classList.remove("hand-hover");
    target?.classList.add("hand-hover");
    hoverEl = target;
  }
}

async function start() {
  $("eq").textContent = "Starting camera…";
  const video = $("cam");
  // A sharper picture (same 4:3 shape as before) gives the hand tracker more detail on the fingertips,
  // so the thumb tip wobbles less, especially when you sit back from the camera.
  video.srcObject = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 960 }, height: { ideal: 720 }, aspectRatio: { ideal: 4 / 3 }, frameRate: { ideal: 30 } } });
  await new Promise(r => video.onloadeddata = r);
  if (video.videoWidth && video.videoHeight) camAspect = video.videoWidth / video.videoHeight;
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(files, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    // Look for up to 4 hands so a background person can't use up the slots meant for yours.
    // Presence/tracking confidence are kept LOW so the tracker holds on to your hand through motion blur
    // and odd angles instead of dropping it mid-line (stricter settings made lines cut out). Background
    // "ghost" hands are filtered out by size instead (frontHands).
    runningMode: "VIDEO", numHands: 4,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.35, minTrackingConfidence: 0.35,
  });
  newEquation();
  loop();
}

// One frame of hand input (also used by tests). hands = [{ lm, side }]
function step(allHands, now) {
  const hands = frontHands(allHands, now);                    // drop people in the background, closest first
  const mainHand = pickMainHand(hands, now);
  if (mainHand) { const gap = now - handSeenAt; handSeenAt = now; oneHand(mainHand.lm, now, gap); }  // only the main hand points, draws, and clicks
  else if (pointer && now - handSeenAt < (penIsDown() ? HAND.lostGraceDrawingMs : HAND.lostGraceMs)) {}   // tracking blink: keep the pen as it was
  else noHands();
  updatePointerUI();
}

function loop() {
  const video = $("cam");
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const now = performance.now();
    const res = landmarker.detectForVideo(video, now);
    const sides = res.handednesses ?? res.handedness ?? [];
    step((res.landmarks ?? []).map((lm, i) => ({ lm, side: sides[i]?.[0]?.categoryName })), now);
  }
  drawFrame();
  requestAnimationFrame(loop);
}

function drawFrame() {           // record the pen and redraw (also used by tests)
  // Draw only when the pinch started on the graph (so a click that drifts onto it doesn't draw).
  const drawing = !!cursor && !revealed &&
    ((pinching && !!pinchStart?.onCanvas) || spaceHeld);
  if (cursor) {
    const [gx, gy] = toGraph(cursor.x, cursor.y);
    trace.push({ x: gx, y: gy, drawing, hx: handGraph?.x, hy: handGraph?.y, pushed });
    if (trace.length > 5000) {
      trace.shift(); if (strokeStart > 0) strokeStart--;
      if (pendingSnap) { pendingSnap.start--; if (pendingSnap.start < 0) pendingSnap = null; }
      if (joined) { joined.start--; joined.cleanEnd--; if (joined.start < 0) joined = null; }
      if (lastStroke) { lastStroke.start--; lastStroke.end--; if (lastStroke.start < 0) lastStroke = null; }
    }
  }
  if (drawing && !wasDrawing) {                                                         // pen down
    let start = resumeStroke(trace.at(-1));                   // same stroke, never snapped
    if (start < 0) { flushSnap(); start = joinStroke(trace.at(-1)); }   // a new stroke (maybe joining the last)
    strokeStart = start >= 0 ? start : trace.length - 1; wasDrawing = true;
  }
  else if (!drawing && wasDrawing) {                                                    // pen up → snap soon
    // Always mark where the line ended, even when the hand has left the camera (then no pen position is
    // recorded this frame). Without the marker, a new line started later was glued onto this one with a
    // straight line across the screen.
    const last = trace.at(-1);
    if (last?.drawing) trace.push({ ...last, drawing: false });
    finishStroke();
  }
  if (!drawing && pendingSnap && performance.now() - pendingSnap.at > SNAP_WAIT.ms) flushSnap();
  render(drawing);
}

// ---------- Controls ----------
function renderDots() {                  // green = checked this round, yellow = current equation
  $("dots").replaceChildren(...Array.from({ length: ROUND }, (_, j) => {
    const d = document.createElement("i");
    d.className = j < doneInRound ? "done" : j === doneInRound ? "now" : "";
    return d;
  }));
}
function clearDrawing() {                // same equation, fresh start (also lets you retry after Check)
  trace = []; revealed = false; feedbackId++; wasDrawing = false; strokeStart = -1; lastStroke = null; pendingSnap = null; joined = null;
  hideResult();
}
// Previous / Next work like a browser's back / forward: Previous goes back to earlier equations, and
// after going back, Next steps forward through them again before making brand-new ones.
const seen = [];           // equations shown so far, in order
let seenAt = -1;           // which one is on screen
function showEquation(eqn) {
  level = eqn; clearDrawing();
  $("eq").textContent = level.label;
  $("prev").disabled = seenAt <= 0;
  renderDots();
}
function newEquation(fresh = false) {                         // Next (fresh = skip ahead to a new one)
  if (doneInRound >= ROUND) doneInRound = 0;                  // start a new round of 5
  if (!fresh && seenAt < seen.length - 1) { seenAt++; return showEquation(seen[seenAt]); }
  let next;
  do { next = randomEquation($("kind").value); } while (level && next.label === level.label);
  seen.splice(seenAt + 1); seen.push(next); seenAt = seen.length - 1;
  showEquation(next);
}
function prevEquation() {
  if (seenAt > 0) { seenAt--; showEquation(seen[seenAt]); }
}
// ---------- Confetti (score of 75 or more) ----------
// Skipped if the 🎉 Confetti setting is off, or the computer is set to reduce motion.
const CONFETTI_SCORE = 75;
let confettiRun = 0;
function confetti() {
  if (!$("celebrate").checked || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const run = ++confettiRun, cv = $("confetti"), c = cv.getContext("2d"), LIFE = 2500;
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = "block";
  const colors = ["--red", "--yellow", "--green", "--blue", "--purple"].map(css);
  const bits = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.4, y: innerHeight * 0.4,
    vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 11,         // burst up and out…
    size: 7 + Math.random() * 7, rot: Math.random() * 6.3, spin: (Math.random() - 0.5) * 0.3,
    color: colors[Math.floor(Math.random() * colors.length)],
  }));
  const start = performance.now();
  (function frame(now) {
    if (run !== confettiRun) return;                                     // a newer burst took over
    const t = now - start;
    c.clearRect(0, 0, cv.width, cv.height);
    for (const b of bits) {
      b.vy += 0.35; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.rot += b.spin;   // …then fall
      c.save(); c.translate(b.x, b.y); c.rotate(b.rot);
      c.globalAlpha = Math.max(0, 1 - t / LIFE);                         // fade out
      c.fillStyle = b.color; c.fillRect(-b.size / 2, -b.size / 4, b.size, b.size / 2);
      c.restore();
    }
    if (t < LIFE) requestAnimationFrame(frame);
    else { c.clearRect(0, 0, cv.width, cv.height); cv.style.display = "none"; }
  })(start);
}

function check() {
  if (revealed || !level) return;                       // avoid repeat checks / repeat Claude calls
  finishStroke(); flushSnap();                          // clean up a stroke still in progress
  const r = score(trace, level, parseFloat($("tolerance").value));
  console.log("score", r);
  revealed = true; showResult(r);
  if (r.overall >= CONFETTI_SCORE) confetti();
  doneInRound = Math.min(ROUND, doneInRound + 1); renderDots();
}
$("clear").onclick = clearDrawing;
$("next").onclick = () => newEquation();
$("prev").onclick = prevEquation;
$("kind").onchange = () => newEquation(true);                // a different kind: straight to a new equation
$("check").onclick = check;
$("zoomIn").onclick = () => setZoom(zoomIdx - 1);
$("zoomOut").onclick = () => setZoom(zoomIdx + 1);
$("contrast").onchange = e => document.body.classList.toggle("contrast", e.target.checked);
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { spaceHeld = true; e.preventDefault(); }
  if (e.code === "Enter") check();
  if (e.code === "KeyC" || e.code === "Backspace") clearDrawing();
  if (e.code === "KeyN") newEquation();
  if (e.code === "KeyP") prevEquation();
  if (e.code === "Equal" || e.code === "NumpadAdd") setZoom(zoomIdx - 1);
  if (e.code === "Minus" || e.code === "NumpadSubtract") setZoom(zoomIdx + 1);
});
addEventListener("keyup", e => { if (e.code === "Space") spaceHeld = false; });

setZoom(1);
start().catch(err => { $("eq").textContent = "Camera error"; $("status").textContent = err.message; });
</script>
</body>
