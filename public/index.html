<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Function Tracer</title>
<style>
  :root { --bg:#fdfbf6; --ink:#1f2933; --grid:#e3e7ec; --axis:#7b8794; --trace:#2563eb; --answer:#16a34a; --cursor:#f97316; }
  body.contrast { --bg:#000; --ink:#fff; --grid:#333; --axis:#ccc; --trace:#ffd400; --answer:#00e5ff; --cursor:#ff4fd8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; }
  #eq { font-size:2rem; font-weight:700; margin-right:auto; }
  button, select, label { font-size:1.1rem; }
  button { padding:10px 18px; border-radius:10px; border:2px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
  #stage { position:relative; width:min(800px, 100vw); aspect-ratio:4/3; margin:0 auto; }
  #cam, #board { position:absolute; inset:0; width:100%; height:100%; }
  #cam { transform:scaleX(-1); opacity:.18; object-fit:cover; }
  #result { text-align:center; font-size:1.4rem; min-height:2.5em; padding:8px 16px; }
  #status { text-align:center; opacity:.7; }
</style>
</head>
<body>
<header>
  <div id="eq">Loading…</div>
  <label><input type="checkbox" id="usePinch" checked> Pinch to draw</label>
  <select id="tolerance">
    <option value="1.5">Forgiving</option>
    <option value="0.75">Normal</option>
    <option value="0.4">Challenge</option>
  </select>
  <label><input type="checkbox" id="contrast"> High contrast</label>
  <button id="clear">Clear</button>
  <button id="check">Check ✓</button>
  <button id="next">Next →</button>
</header>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="board" width="800" height="600"></canvas>
</div>
<div id="result"></div>
<div id="status">Pinch thumb + index finger (or hold SPACE) to draw. Press ENTER to check.</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---------- Graph setup ----------
const W = 800, H = 600, XMIN = -5, XMAX = 5, YMIN = -5, YMAX = 5;
const toPx = (x, y) => [(x - XMIN) / (XMAX - XMIN) * W, H - (y - YMIN) / (YMAX - YMIN) * H];
const toGraph = (px, py) => [XMIN + px / W * (XMAX - XMIN), YMIN + (H - py) / H * (YMAX - YMIN)];

// ---------- Levels (Person B owns this) ----------
// Each level is a list of pieces, so piecewise functions can be added later without changing scoring.
const LEVELS = [
  { label: "y = 2x + 1",  pieces: [{ f: x => 2 * x + 1, xmin: -5, xmax: 5 }] },
  { label: "y = −x + 3",  pieces: [{ f: x => -x + 3,    xmin: -5, xmax: 5 }] },
  { label: "y = 3",       pieces: [{ f: x => 3,         xmin: -5, xmax: 5 }] },
  { label: "y = ½x − 2",  pieces: [{ f: x => 0.5 * x - 2, xmin: -5, xmax: 5 }] },
  { label: "y = x² − 3",  pieces: [{ f: x => x * x - 3, xmin: -5, xmax: 5 }] },
];
let levelIdx = 0;

// ---------- State ----------
let trace = [];            // A -> B contract: [{x, y, drawing}]
let cursor = null;         // smoothed cursor in pixels
let pinching = false, spaceHeld = false, revealed = false;

const $ = id => document.getElementById(id);
const ctx = $("board").getContext("2d");
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();

// ---------- Scoring (Person B) ----------
function visibleRange(pc) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i <= 400; i++) {
    const x = pc.xmin + (pc.xmax - pc.xmin) * i / 400, y = pc.f(x);
    if (y >= YMIN && y <= YMAX) { lo = Math.min(lo, x); hi = Math.max(hi, x); }
  }
  return [lo, hi];
}
function slope(xs, ys) {
  const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) ** 2; }
  return den === 0 ? 0 : num / den;
}
function score(trace, level, tol) {
  const pts = trace.filter(p => p.drawing);
  const pieces = level.pieces.map(pc => {
    const [lo, hi] = visibleRange(pc);
    const mine = pts.filter(p => p.x >= lo && p.x <= hi);
    if (mine.length < 5 || hi <= lo) return { score: 0, mistake: "missing_piece" };
    const avgErr = mine.reduce((s, p) => s + Math.abs(p.y - pc.f(p.x)), 0) / mine.length;
    const BINS = 20;
    const hit = new Set(mine.map(p => Math.min(BINS - 1, Math.floor((p.x - lo) / (hi - lo) * BINS))));
    const coverage = hit.size / BINS;
    const xs = mine.map(p => p.x);
    const userSlope = slope(xs, mine.map(p => p.y));
    const trueSlope = slope(xs, xs.map(pc.f));
    let mistake = null;
    if (Math.abs(trueSlope) > 0.2 && Math.sign(userSlope) !== Math.sign(trueSlope)) mistake = "wrong_direction";
    else if (avgErr > tol) mistake = "off_target";
    else if (coverage < 0.6) mistake = "incomplete";
    const accuracy = Math.max(0, 1 - avgErr / (2 * tol));
    const avgOffset = mine.reduce((s, p) => s + (p.y - pc.f(p.x)), 0) / mine.length; // + = drawn too high
    const r2 = v => Math.round(v * 100) / 100;
    return {
      score: Math.round(100 * accuracy * Math.min(1, coverage / 0.8)), mistake,
      userSlope: r2(userSlope), trueSlope: r2(trueSlope),
      avgErr: r2(avgErr), avgOffset: r2(avgOffset), coverage: r2(coverage),
    };
  });
  const overall = Math.round(pieces.reduce((s, p) => s + p.score, 0) / pieces.length);
  return { pieces, overall }; // B -> C contract
}

// ---------- Feedback (Person C) ----------
// Claude explains the mistake; these fixed messages are the backup if the server or Claude is unavailable.
const MESSAGES = {
  wrong_direction: "Your line went the opposite way. Look at the number in front of x: positive goes up, negative goes down.",
  off_target: "Good shape! It's a bit away from where it should be. Check where it crosses the y-axis.",
  incomplete: "Nice start! Try drawing across more of the graph.",
  missing_piece: "I didn't see a drawing yet. Pinch (or hold space) and trace the graph.",
};
let feedbackId = 0;
async function showResult(r) {
  const id = ++feedbackId;
  const m = r.pieces.find(p => p.mistake)?.mistake;
  const fallback = m ? MESSAGES[m] : "Amazing — that's the graph!";
  const show = text => { if (id === feedbackId) $("result").textContent = `Score: ${r.overall} ⭐  ${text}`; };
  if (m === "missing_piece") return show(fallback);       // nothing drawn: no need to ask Claude
  show("Thinking…");
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const resp = await fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ equation: LEVELS[levelIdx].label, overall: r.overall, pieces: r.pieces }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const { text } = await resp.json();
    show(text || fallback);
  } catch (err) {
    console.warn("Claude feedback unavailable, using backup message:", err.message);
    show(fallback);
  }
}

// ---------- Drawing ----------
function drawGrid() {
  ctx.fillStyle = css("--bg"); ctx.globalAlpha = 0.6; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  ctx.lineWidth = 1; ctx.strokeStyle = css("--grid");
  for (let v = XMIN; v <= XMAX; v++) {
    let [px] = toPx(v, 0); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
    let [, py] = toPx(0, v); ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
  }
  ctx.lineWidth = 3; ctx.strokeStyle = css("--axis");
  const [ox, oy] = toPx(0, 0);
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.stroke();
}
function drawAnswer() {
  ctx.lineWidth = 5; ctx.strokeStyle = css("--answer"); ctx.setLineDash([12, 8]);
  for (const pc of LEVELS[levelIdx].pieces) {
    ctx.beginPath(); let started = false;
    for (let i = 0; i <= 400; i++) {
      const x = pc.xmin + (pc.xmax - pc.xmin) * i / 400, y = pc.f(x);
      if (y < YMIN || y > YMAX) { started = false; continue; }
      const [px, py] = toPx(x, y);
      started ? ctx.lineTo(px, py) : ctx.moveTo(px, py); started = true;
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function drawTrace() {
  ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = css("--trace");
  ctx.beginPath();
  for (let i = 0; i < trace.length; i++) {
    const p = trace[i]; if (!p.drawing) continue;
    const [px, py] = toPx(p.x, p.y);
    (i > 0 && trace[i - 1].drawing) ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}
function drawCursor(drawing) {
  if (!cursor) return;
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, drawing ? 14 : 18, 0, Math.PI * 2);
  ctx.lineWidth = 4; ctx.strokeStyle = css("--cursor"); ctx.fillStyle = css("--cursor");
  drawing ? ctx.fill() : ctx.stroke();
}

// ---------- Hand tracking (Person A) ----------
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
let landmarker, lastVideoTime = -1;

async function start() {
  $("eq").textContent = "Starting camera…";
  const video = $("cam");
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  await new Promise(r => video.onloadeddata = r);
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(files, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO", numHands: 1,
  });
  loadLevel(0);
  loop();
}

function loop() {
  const video = $("cam");
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    const lm = res.landmarks?.[0];
    if (lm) {
      const tip = lm[8];
      const raw = { x: (1 - tip.x) * W, y: tip.y * H };          // mirrored so it feels like a mirror
      const a = 0.35;                                             // smoothing (lower = smoother, laggier)
      cursor = cursor ? { x: cursor.x + a * (raw.x - cursor.x), y: cursor.y + a * (raw.y - cursor.y) } : raw;
      const ratio = dist(lm[4], lm[8]) / dist(lm[0], lm[9]);       // pinch size relative to hand size
      if (!pinching && ratio < 0.3) pinching = true;
      else if (pinching && ratio > 0.45) pinching = false;
    } else {
      cursor = null; pinching = false;
    }
  }
  const drawing = !!cursor && !revealed && (($("usePinch").checked && pinching) || spaceHeld);
  if (cursor) {
    const [gx, gy] = toGraph(cursor.x, cursor.y);
    trace.push({ x: gx, y: gy, drawing });
    if (trace.length > 5000) trace.shift();
  }
  drawGrid(); if (revealed) drawAnswer(); drawTrace(); drawCursor(drawing);
  requestAnimationFrame(loop);
}

// ---------- Controls ----------
function loadLevel(i) {
  levelIdx = (i + LEVELS.length) % LEVELS.length;
  trace = []; revealed = false; feedbackId++;
  $("eq").textContent = LEVELS[levelIdx].label; $("result").textContent = "";
}
function check() {
  if (revealed) return;                                 // avoid repeat checks / repeat Claude calls
  const r = score(trace, LEVELS[levelIdx], parseFloat($("tolerance").value));
  console.log("score", r);
  revealed = true; showResult(r);
}
$("clear").onclick = () => loadLevel(levelIdx);
$("next").onclick = () => loadLevel(levelIdx + 1);
$("check").onclick = check;
$("contrast").onchange = e => document.body.classList.toggle("contrast", e.target.checked);
addEventListener("keydown", e => {
  if (e.code === "Space") { spaceHeld = true; e.preventDefault(); }
  if (e.code === "Enter") check();
});
addEventListener("keyup", e => { if (e.code === "Space") spaceHeld = false; });

start().catch(err => { $("eq").textContent = "Camera error"; $("status").textContent = err.message; });
</script>
</body>
</html>
